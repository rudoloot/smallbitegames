<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문제 제작실 · Factory Fit</title><link rel="stylesheet" href="./src/editor.css?v=f3ea049c10ad"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js?v=104f56145899","three/addons/":"./vendor/three/addons/","three/addons/geometries/RoundedBoxGeometry.js":"./vendor/three/addons/geometries/RoundedBoxGeometry.js?v=c5feab961238","./src/editor-scene.js":"./src/editor-scene.js?v=da3547074af6","./src/editor.js":"./src/editor.js?v=e938de474e28","./src/game-main.js":"./src/game-main.js?v=8c6e396b1b67","./src/game/config.js":"./src/game/config.js?v=e16e544a27da","./src/game/docks.js":"./src/game/docks.js?v=99b1304d3bb3","./src/game/equipment-shapes.js":"./src/game/equipment-shapes.js?v=d6196d6fb9a7","./src/game/first-box-stage.js":"./src/game/first-box-stage.js?v=482f61dde4d7","./src/game/layout.js":"./src/game/layout.js?v=27206e039be8","./src/game/product-stages.js":"./src/game/product-stages.js?v=f892bcf808f9","./src/game/products.js":"./src/game/products.js?v=fd0006e0607b","./src/game/restore-variants.js":"./src/game/restore-variants.js?v=bdc2c5fd01d8","./src/game/session.js":"./src/game/session.js?v=82766bb6b059","./src/game/simulation.js":"./src/game/simulation.js?v=f5dcf7478350","./src/game/stages.js":"./src/game/stages.js?v=0bb9901ea8ac","./src/main.js":"./src/main.js?v=f42029b9975c","./src/platform/storage.js":"./src/platform/storage.js?v=03386616c825","./src/view/art.js":"./src/view/art.js?v=409dc299296a","./src/view/equipment-models.js":"./src/view/equipment-models.js?v=a3d0afe6771b","./src/view/equipment-previews.js":"./src/view/equipment-previews.js?v=c3f7f0b6e7e9","./src/view/factory.js":"./src/view/factory.js?v=e720fc38164e","./src/view/shape-options.js":"./src/view/shape-options.js?v=63bb744ead44","./src/view/ui-icons.js":"./src/view/ui-icons.js?v=e5ac043fae8f","./src/view/worker-previews.js":"./src/view/worker-previews.js?v=6bc <body><main class="studio">
<header><a href="./" aria-label="공장 지도" data-icon="map"></a><div class="title"><small>FACTORY FIT</small><h1>문제 제작실</h1></div><div class="header-actions"><button id="configure">문제 설정</button><button id="play">게임에서 열기</button></div></header>
<section class="board-panel" aria-label="공장 편집"><div class="board-head"><div class="tabs" aria-label="편집할 배치"><button data-mode="start">시작 배치</button><button data-mode="reference">정답 배치</button></div><div class="camera-tools"><button id="grid-toggle" aria-pressed="false">격자 보기</button><button id="fit" aria-label="전체 보기" data-icon="fit"></button><button id="undo" aria-label="편집 되돌리기" data-icon="undo"></button></div></div>
<div class="surface"><div id="scene-frame"></div><div class="viewport" hidden><div id="board" aria-label="공장 편집 격자"></div></div></div>
<div class="board-foot"><span id="hint"></span><span id="count"></span></div></section>
<section class="tray" aria-label="설치 도구"><div class="tray-heading"><div class="tabs" id="palette"><button data-group="machines">설비</button><button data-group="workers">작업자</button><button data-group="terrain">부지·시설</button></div><select id="shape" aria-label="설비 모양"></select><button id="rotate">회전 0°</button></div>
<div class="tools cards" id="equipment"></div><div id="worker-panel" hidden><img id="portrait" alt=""><label>배치할 작업자<select id="worker"></select></label><button data-tool="worker">작업자 배치</button></div><div class="tools" id="terrain" hidden></div>
<div class="tray-foot"><div class="edit-actions"><button data-tool="move">설비 이동</button><button data-tool="erase">삭제</button></div><button id="simulate">생산량 측정</button></div>
<p id="status" role="status"></p></section>
<dialog id="settings"><div class="dialog-heading"><h2>문제 설정</h2><button id="close-settings">닫기</button></div><label>문제 이름<input id="name" maxlength="60"></label><label>목표 생산량 (개/분)<input id="target" type="number" min="0.1" max="999" step=".1"></label>
<label>생산 제품<select id="factory"></select></label><details class="process-options"><summary>사용할 공정 선택</summary><div id="steps"></div></details><p id="process-flow" class="plan-note"></p><div class="dimensions"><label>격자 너비<input id="width" type="number" min="4" max="64"></label><label>격자 높이<input id="height" type="number" min="4" max="64"></label></div>
<p class="plan-note">설비·작업자·입고장은 배치별로 저장합니다. 바닥·장애물·출고장은 두 배치가 공유합니다.</p><div class="files"><button id="new">새 문제</button><button id="import">불러오기</button><input id="file" hidden type="file" accept=".json,application/json"><button id="export">파일로 저장</button></div></dialog>
</main><script type="module" src="./src/editor.js?v=e938de474e28"></script></body></html>
