    if(e.key.toLowerCase()==='s')keyboardAim.spin=0;
    if(e.key==='ArrowLeft')keyboardAim.angle-=Math.PI/36;
    if(e.key==='ArrowRight')keyboardAim.angle+=Math.PI/36;
    if(['ArrowUp','+','='].includes(e.key))keyboardAim.power=Math.min(P.MAX_PULL,keyboardAim.power+6);
    if(['ArrowDown','-','_'].includes(e.key))keyboardAim.power=Math.max(9,keyboardAim.power-6);
    if(e.key===' '||e.key==='Enter'){fire(currentAim());return;}setPower(keyboardAim.power);
  });
  $('wait-turn').addEventListener('click',()=>{if(blocked())return;cancelAim();P.wait(state);handleEvents();syncUi();canvas.focus({preventScroll:true});});
  P.CONSUMABLE_SLOTS.forEach((id,index)=>$(`consumable-${index+1}`).addEventListener('click',()=>activateConsumable(index)));
  $('map-stats').addEventListener('click',openStats);$('stats-open').addEventListener('click',openStats);$('shop-stats').addEventListener('click',openStats);$('stats-close').addEventListener('click',closeStats);
  $('stats-overlay').addEventListener('click',e=>{if(e.target===$('stats-overlay'))closeStats();});
  $('pause-open').addEventListener('click',()=>{if(state.phase==='levelup'||['won','lost'].includes(state.phase))return;cancelAim();paused=true;$('pause-overlay').hidden=false;$('resume').focus({preventScroll:true});});
  $('map-menu').addEventListener('click',()=>{cancelAim();paused=true;$('pause-overlay').hidden=false;$('resume').focus({preventScroll:true});});
  $('village-heal').addEventListener('click',()=>{if(P.villageHeal(state)){handleEvents();syncUi();checkpoint(true);}});
  $('resume').addEventListener('click',closePause);
  $('restart').addEventListener('click',()=>{reset();canvas.focus({preventScroll:true});});
  $('new-map').addEventListener('click',()=>{reset(freshSeed());canvas.focus({preventScroll:true});});
  $('result-retry').addEventListener('click',()=>{reset();canvas.focus({preventScroll:true});});
  $('result-new').addEventListener('click',()=>{reset(freshSeed());canvas.focus({preventScroll:true});});
  $('shop-reroll').addEventListener('click',()=>{if(P.rerollShop(state)){renderVillage();syncUi();checkpoint(true);}});
  $('next-stage').addEventListener('click',()=>{
    if(P.leaveVillage(state)){cancelAim();handleEvents();syncUi();checkpoint(true);}
  });
  function syncSound(){$('sound-toggle').setAttribute('aria-pressed',String(soundOn));$('sound-toggle').setAttribute('aria-label',soundOn?'효과음 끄기':'효과음 켜기');$('sound-waves').setAttribute('d',soundOn?'M15 8Q20 12 15 16M18 5Q25 12 18 19':'M16 9L21 15M21 9L16 15');}
  $('sound-toggle').addEventListener('click',()=>{soundOn=!soundOn;syncSound();if(soundOn)sound('item');});
  document.addEventListener('visibilitychange',()=>{lastFrame=0;accumulator=0;if(document.hidden){cancelAim();checkpoint(true);}});
  function resizeViewport(){
    const r=canvas.getBoundingClientRect(),view=C.viewport(r.width,r.height,P.VIEW_HEIGHT_METERS*P.UNITS_PER_METER),dpr=Math.min(window.devicePixelRatio||1,2);
    VW=view.width;VH=view.height;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));camera.width=VW;camera.height=VH;cancelAim();if(state)C.follow(camera,state.player);
  }
  function frame(timestamp){
    const dt=lastFrame?Math.min((timestamp-lastFrame)/1000,.05):0;lastFrame=timestamp;time+=dt;
    if(!paused&&!statsOpen){accumulator+=dt;while(accumulator>=1/120){P.step(state,1/120);handleEvents();accumulator-=1/120;}}
    else accumulator=0;
    if(['moving','recoil'].includes(state.phase)){trail.push({x:state.player.x,y:state.player.y});if(trail.length>15)trail.shift();}else trail=[];
    updateEffects(dt);syncUi();checkpoint();C.follow(camera,state.player);
    ctx.setTransform(canvas.width/VW,0,0,canvas.height/VH,0,0);ctx.clearRect(0,0,VW,VH);ctx.fillStyle=P.STAGES[state.stage].outside;ctx.fillRect(0,0,VW,VH);
    ctx.save();ctx.translate(-camera.x,-camera.y);ctx.drawImage(floor,0,0);drawHazards();
    for(const rock of state.rocks){orb(rock.x,rock.y,rock.r,PALETTES.rock);ctx.strokeStyle='#7b8a6c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(rock.x-12,rock.y-4);ctx.lineTo(rock.x,rock.y+8);ctx.lineTo(rock.x+9,rock.y-10);ctx.stroke();}
    for(const b of state.boxes)if(b.alive)drawBox(b);
    for(const e of state.enemies.filter(e=>e.alive).sort((a,b)=>a.y-b.y))drawEnemy(e);
    drawAim();drawPlayer();drawEffects();ctx.restore();drawBossIndicator();
    requestAnimationFrame(frame);
  }
  new ResizeObserver(resizeViewport).observe($('arena-wrap'));
  resizeViewport();if(!restore())reset();requestAnimationFrame(frame);
})();

</script>
<style>.site-return{display:block;width:100%;margin-top:12px;text-align:center}</style>
<script>(()=>{let target=null;try{const raw=new URLSearchParams(location.search).get('returnTo');if(raw){const url=new URL(raw);if(url.protocol==='https:'&&url.origin===location.origin&&!url.username&&!url.password)target=url;}}catch{}if(!target)return;for(const [selector,id] of [['.pause-panel','site-exit'],['.shop-bottom','site-exit-shop'],['.result-panel','site-exit-result']]){const panel=document.querySelector(selector);if(!panel)continue;const button=document.createElement('button');button.id=id;button.type='button';button.className='text-button site-return';button.textContent='사이트로 돌아가기';button.addEventListener('click',()=>location.replace(target.href));panel.append(button);}})();</script>
