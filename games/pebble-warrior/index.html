  <style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#293f35;background:#778560}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #dd7845;outline-offset:3px}
svg{width:22px;height:22px}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.arena-wrap{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;isolation:isolate}
#arena{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#arena:active{cursor:grabbing}
#arena:focus-visible{box-shadow:inset 0 0 0 2px #dd7845}
.hud,.game-controls{position:absolute;top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
.hud{left:calc(14px + env(safe-area-inset-left));pointer-events:none;font-size:12px;font-weight:600}
.hud>span{padding:9px 12px;background:#f5f5e5d9;border:1px solid #ffffff66;border-radius:10px;backdrop-filter:blur(6px)}
.game-controls{right:calc(14px + env(safe-area-inset-right))}
.icon-button{display:grid;place-items:center;width:40px;height:40px;background:#f5f5e5d9;border:1px solid #ffffff66;border-radius:11px;backdrop-filter:blur(6px)}
.icon-button:hover{background:#fffdeb}
.combo-label{position:absolute;top:calc(70px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;color:#a6532d;font-size:20px;font-weight:800;text-shadow:0 1px #f7f4df;opacity:0;transition:opacity .2s}
.combo-label.visible{opacity:1}
.power-meter{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:min(260px,65%);padding:10px 14px;border-radius:12px;background:#f5f5e5e6;pointer-events:none}
.power-meter[hidden]{display:none}
.power-track{height:5px;flex:1;border-radius:4px;background:#cad2b8;overflow:hidden}
#power-fill{height:100%;width:0;background:#dd7845}
#power-value{min-width:36px;text-align:right;font-size:12px}
.result-overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#283d2a55;backdrop-filter:blur(4px)}
.result-overlay[hidden]{display:none}
.result-card{width:min(100%,330px);padding:28px 22px;text-align:center;border:1px solid #ffffff88;border-radius:18px;background:#f6f5ef;box-shadow:0 12px 40px #233c3433}
.result-card h1{font-size:25px;margin:0 0 22px}
.result-stats{display:flex;justify-content:center;gap:22px;margin-bottom:24px;font-size:10px;color:#7c896f}
.result-stats strong{display:block;margin-top:6px;font-size:24px;color:#446a49}
.primary-button{width:100%;padding:13px 16px;border-radius:9px;background:#dd7845;color:#fff7e9;font-weight:700;font-size:13px}
.primary-button:hover{background:#c96a38}
.text-button{background:transparent;padding:13px 8px 0;font-size:12px;color:#6f7e62}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

  <main class="arena-wrap" id="arena-wrap" aria-label="Pebble Warrior">

      <button class="icon-button" id="new-map" title="새로운 무작위 배치" aria-label="새로운 무작위 배치"><svg><use href="#shuffle"/></svg></button>

<script>
/* Pure, deterministic game rules. Shared by the browser and Node checks. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.PebblePhysics = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const WIDTH = 1080, HEIGHT = 1080, COUNT = 50;
  const BOUNDS = { left: 24, right: 1056, top: 24, bottom: 1056 };
  const PLAYER_RADIUS = 24, MAX_PULL = 150, FRICTION = 185;
  const ENEMY_DISTANCE = 36, ENEMY_DURATION = .65, ENEMY_GAP = 4;
  const EPS = 0.00001;

  function random(seed) {
    let a = seed >>> 0;
    return function () {
      a += 0x6D2B79F5;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function createGame(seed) {
    const rng = random(seed);
    const player = { x: 540, y: 850, vx: 0, vy: 0, r: PLAYER_RADIUS, level: 2 };
    const enemies = [];
    // A nearby level-one stone makes every seed playable from the initial shot.
    enemies.push({ id: 0, x: 495 + rng() * 90, y: 700 + rng() * 22, r: 25, level: 1, alive: true, shape: rng() * 6.28 });
    for (let i = 1; i < COUNT; i++) {
      const level = i < 10 ? i + 1 : 1 + Math.floor(rng() * 10);
      const r = 24 + level * 0.45;
      let found = false;
      for (let attempt = 0; attempt < 12000; attempt++) {
        const x = 66 + rng() * 948, y = 66 + rng() * 948;
        if (Math.hypot(x - player.x, y - player.y) < 155) continue;
        if (enemies.some(e => Math.hypot(x - e.x, y - e.y) < e.r + r + 17)) continue;
        enemies.push({ id: i, x, y, r, level, alive: true, shape: rng() * 6.28 });
        found = true;
        break;
      }
      if (!found) throw new Error('Could not place all fifty stones without overlap.');
    }
    return { seed: seed >>> 0, player, enemies, phase: 'ready', shots: 0, defeated: 0, combo: 0, bestCombo: 0, turn: 1, enemyTurns: 0, enemyRemaining: 0, enemyOrder: [], merges: 0, events: [] };
  }

  function launch(state, dx, dy) {
    if (state.phase !== 'ready') return false;
    const distance = Math.hypot(dx, dy);
    if (distance < 8) return false;
    const speed = Math.min(distance, MAX_PULL) * 6.2;
    state.player.vx = dx / distance * speed;
    state.player.vy = dy / distance * speed;
    state.phase = 'moving';
    state.shots++;
    state.combo = 0;
    state.events.push({ type: 'launch', speed });
    return true;
  }

  function circleHit(p, enemy, duration) {
    const dx = p.x - enemy.x, dy = p.y - enemy.y;
    const r = p.r + enemy.r;
    const a = p.vx * p.vx + p.vy * p.vy;
    if (a < EPS) return null;
    const b = 2 * (dx * p.vx + dy * p.vy);
    if (b >= 0) return null;
    const c = dx * dx + dy * dy - r * r;
    const discriminant = b * b - 4 * a * c;
    if (discriminant < 0) return null;
    const t = c <= EPS ? 0 : (-b - Math.sqrt(discriminant)) / (2 * a);
    if (t < -EPS || t > duration + EPS) return null;
    const cx = dx + p.vx * t, cy = dy + p.vy * t;
    const length = Math.hypot(cx, cy) || 1;
    return { t: Math.max(0, t), nx: cx / length, ny: cy / length, enemy };
  }

  function nextCollision(state, duration) {
    const p = state.player;
    let best = null;
    const offer = hit => {
      if (hit && hit.t >= -EPS && hit.t <= duration + EPS && (!best || hit.t < best.t)) best = hit;
    };
    if (p.vx < -EPS) offer({ t: (BOUNDS.left + p.r - p.x) / p.vx, nx: 1, ny: 0 });
    if (p.vx > EPS) offer({ t: (BOUNDS.right - p.r - p.x) / p.vx, nx: -1, ny: 0 });
    if (p.vy < -EPS) offer({ t: (BOUNDS.top + p.r - p.y) / p.vy, nx: 0, ny: 1 });
    if (p.vy > EPS) offer({ t: (BOUNDS.bottom - p.r - p.y) / p.vy, nx: 0, ny: -1 });
    for (const e of state.enemies) if (e.alive) offer(circleHit(p, e, duration));
    return best;
  }

  function finishShot(state) {
    state.player.vx = 0;
    state.player.vy = 0;
    if (state.enemies.every(e => !e.alive)) {
      state.phase = 'won';
      state.events.push({ type: 'win', combo: state.combo });
      return;
    }
    state.events.push({ type: 'rest', combo: state.combo });
    startEnemyTurn(state);
  }

  function startEnemyTurn(state) {
    state.phase = 'enemy';
    state.enemyTurns++;
    state.enemyRemaining = ENEMY_DURATION;
    state.enemyOrder = state.enemies.filter(e => e.alive).sort((a, b) =>
      Math.hypot(a.x - state.player.x, a.y - state.player.y) - Math.hypot(b.x - state.player.x, b.y - state.player.y) || a.id - b.id);
    for (const e of state.enemyOrder) e.turnTravel = 0;
    state.events.push({ type: 'enemy_start', count: state.enemyOrder.length });
  }

  function enemyIntent(state, e) {
    const sign = Math.sign(e.level - state.player.level);
    if (!sign) return { dx: 0, dy: 0, type: 'hold' };
    const dx = state.player.x - e.x, dy = state.player.y - e.y;
    const length = Math.hypot(dx, dy) || 1;
    return { dx: dx / length * sign, dy: dy / length * sign, type: sign > 0 ? 'chase' : sign < 0 ? 'flee' : 'hold' };
  }

  function loseToEnemy(state, e) {
    state.phase = 'lost';
    state.player.vx = state.player.vy = 0;
    state.events.push({ type: 'lose', enemyLevel: e.level, x: state.player.x, y: state.player.y, cause: 'enemy_attack' });
  }

  function mergeEnemies(state, absorbed, survivor) {
    const fromLevel = survivor.level;
    absorbed.alive = false;
    absorbed.mergedInto = survivor.id;
    survivor.level += absorbed.level;
    survivor.units = (survivor.units || 1) + (absorbed.units || 1);
    state.merges++;
    // Keep the survivor's collider and center so merging never creates overlap.
    state.events.push({ type: 'merge', aId: absorbed.id, bId: survivor.id, fromLevel, level: survivor.level, x: survivor.x, y: survivor.y, fromX: absorbed.x, fromY: absorbed.y });
    if (survivor.level > state.player.level && Math.hypot(survivor.x - state.player.x, survivor.y - state.player.y) <= survivor.r + state.player.r + EPS) loseToEnemy(state, survivor);
  }

  function stepEnemies(state, dt) {
    const duration = Math.min(dt, state.enemyRemaining);
    // Resolve existing contact first, including stationary stones at player level.
    for (let i = 0; i < state.enemyOrder.length && state.phase === 'enemy'; i++) {
      const a = state.enemyOrder[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < state.enemyOrder.length; j++) {
        const b = state.enemyOrder[j];
        if (b.alive && a.level === b.level && Math.hypot(a.x - b.x, a.y - b.y) <= a.r + b.r + EPS) {
          mergeEnemies(state, b, a);
          if (state.phase !== 'enemy') return;
          j = i; // A newly doubled stone can merge again on contact.
        }
      }
    }
    for (const e of state.enemyOrder) {
      if (!e.alive || state.phase !== 'enemy') continue;
      if (e.level > state.player.level && Math.hypot(e.x - state.player.x, e.y - state.player.y) <= e.r + state.player.r + EPS) { loseToEnemy(state, e); return; }
      const intent = enemyIntent(state, e);
      if (intent.type === 'hold') continue;
      const speed = ENEMY_DISTANCE / ENEMY_DURATION;
      const mover = { x: e.x, y: e.y, r: e.r, vx: intent.dx * speed, vy: intent.dy * speed };
      let allowed = duration, collision = null;
      const offer = (hit, kind, other = null) => {
        if (hit && hit.t <= allowed + EPS) { allowed = Math.max(0, hit.t); collision = { kind, other }; }
      };
      const wall = t => { if (t >= -EPS && t <= allowed) { allowed = Math.max(0, t); collision = { kind: 'wall' }; } };
      if (mover.vx < -EPS) wall((BOUNDS.left + e.r - e.x) / mover.vx);
      if (mover.vx > EPS) wall((BOUNDS.right - e.r - e.x) / mover.vx);
      if (mover.vy < -EPS) wall((BOUNDS.top + e.r - e.y) / mover.vy);
      if (mover.vy > EPS) wall((BOUNDS.bottom - e.r - e.y) / mover.vy);
      offer(circleHit(mover, state.player, duration), 'player');
      for (const other of state.enemyOrder) {
        if (other === e || !other.alive) continue;
        const canMerge = e.level === other.level;
        offer(circleHit(mover, { ...other, r: other.r + (canMerge ? 0 : ENEMY_GAP) }, duration), canMerge ? 'merge' : 'blocked', other);
      }
      const travel = collision && collision.kind === 'blocked' ? Math.max(0, allowed - .000001) : allowed;
      e.x = Math.max(BOUNDS.left + e.r, Math.min(BOUNDS.right - e.r, e.x + mover.vx * travel));
      e.y = Math.max(BOUNDS.top + e.r, Math.min(BOUNDS.bottom - e.r, e.y + mover.vy * travel));
      e.turnTravel += speed * travel;
      if (e.level > state.player.level && Math.hypot(e.x - state.player.x, e.y - state.player.y) <= e.r + state.player.r + EPS) { loseToEnemy(state, e); return; }
      if (collision?.kind === 'merge') {
        mergeEnemies(state, e, collision.other);
        if (state.phase !== 'enemy') return;
      }
    }
    state.enemyRemaining = Math.max(0, state.enemyRemaining - duration);
    if (state.enemyRemaining < EPS) {
      state.phase = 'ready';
      state.turn = state.shots + 1;
      state.events.push({ type: 'enemy_end', moved: state.enemyOrder.filter(e => e.alive && e.turnTravel > .1).length });
      state.enemyOrder = [];
    }
  }

  function step(state, dt) {
    dt = Math.max(0, Math.min(dt, 1 / 30));
    if (state.phase === 'enemy') { stepEnemies(state, dt); return; }
    if (state.phase !== 'moving') return;
    const p = state.player;
    let remaining = Math.min(dt, 1 / 30);
    let loops = 0;
    while (remaining > EPS && state.phase === 'moving' && loops++ < 12) {
      const hit = nextCollision(state, remaining);
      if (!hit) { p.x += p.vx * remaining; p.y += p.vy * remaining; break; }
      p.x += p.vx * hit.t;
      p.y += p.vy * hit.t;
      remaining -= hit.t;
      const impact = p.vx * hit.nx + p.vy * hit.ny;
      if (hit.enemy) {
        const e = hit.enemy;
        if (e.level > p.level) {
          state.phase = 'lost';
          state.events.push({ type: 'lose', enemyLevel: e.level, x: p.x, y: p.y, cause: 'player_collision' });
          p.vx = p.vy = 0;
          return;
        }
        if (e.level === p.level) {
          state.events.push({ type: 'equal', level: e.level, x: e.x, y: e.y });
          finishShot(state);
          return;
        }
        e.alive = false;
        p.level += e.level;
        state.defeated += e.units || 1;
        state.combo++;
        state.bestCombo = Math.max(state.bestCombo, state.combo);
        state.events.push({ type: 'defeat', x: e.x, y: e.y, r: e.r, shape: e.shape, level: e.level, playerLevel: p.level, combo: state.combo, vx: -hit.nx * (Math.abs(impact) * .66 + 140), vy: -hit.ny * (Math.abs(impact) * .66 + 140) });
      } else {
        state.events.push({ type: 'wall', x: p.x, y: p.y });
      }
      const retention = hit.enemy ? 0.92 : 0.83;
      p.vx = (p.vx - 2 * impact * hit.nx) * retention;
      p.vy = (p.vy - 2 * impact * hit.ny) * retention;
      p.x += hit.nx * .04;
      p.y += hit.ny * .04;
    }
    // Numerical guard: a collision-heavy corner can never move the player outside.
    p.x = Math.max(BOUNDS.left + p.r, Math.min(BOUNDS.right - p.r, p.x));
    p.y = Math.max(BOUNDS.top + p.r, Math.min(BOUNDS.bottom - p.r, p.y));
    const speed = Math.hypot(p.vx, p.vy);
    const nextSpeed = Math.max(0, speed - FRICTION * dt);
    if (nextSpeed < 13) finishShot(state);
    else { p.vx *= nextSpeed / speed; p.vy *= nextSpeed / speed; }
  }

    for (const [label, value] of [['도달 레벨', state.player.level], ['격파한 돌', state.defeated], ['발사 횟수', state.shots]]) {
      const el = document.createElement('div'); el.textContent = label;
      const strong = document.createElement('strong'); strong.textContent = value; el.append(strong); $('result-stats').append(el);
    }
    $('result-overlay').hidden = false;
    $('result-retry').focus({ preventScroll: true });
  }

  function setPower(distance) {
    const percent = Math.round(Math.min(1, distance / P.MAX_PULL) * 100);
    $('power-meter').hidden = percent === 0;
    $('power-fill').style.width = percent + '%'; $('power-value').replaceChildren(document.createTextNode(String(percent)));
    const unit = document.createElement('span'); unit.textContent = '%'; $('power-value').append(unit);
  }
  function screenPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / rect.width * VW, y: (event.clientY - rect.top) / rect.height * VH };
  }
  function position(event) { return C.screenToWorld(camera, screenPosition(event)); }
  function cancelAim() { drag = null; keyboardAim = null; setPower(0); }
  function fire(aim) {
    if (!aim) return;
    P.launch(state, aim.dx, aim.dy);
    cancelAim(); handleEvents(); syncUi();
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0 || state.phase !== 'ready' || drag) return;
    const point = position(e), rect = canvas.getBoundingClientRect();
    // The player has at least a 48 CSS-pixel target even on a small phone.
    e.preventDefault(); keyboardAim = null;
    if (Math.hypot(point.x - state.player.x, point.y - state.player.y) <= Math.max(45, 26 * VW / rect.width)) {
      drag = { startX: point.x, startY: point.y, x: point.x, y: point.y, pointerId: e.pointerId };
    } else return;
    canvas.setPointerCapture(e.pointerId); canvas.focus({ preventScroll: true });
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const point = position(e); drag.x = point.x; drag.y = point.y;
    setPower(Math.hypot(drag.startX - drag.x, drag.startY - drag.y));
  });
  canvas.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const point = position(e); drag.x = point.x; drag.y = point.y;
    const aim = currentAim(); canvas.releasePointerCapture(e.pointerId); fire(aim);
  });
  canvas.addEventListener('pointercancel', cancelAim);
  canvas.addEventListener('lostpointercapture', () => { if (drag) cancelAim(); });
  window.addEventListener('blur', cancelAim);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { cancelAim(); return; }
    if (state.phase !== 'ready' || document.activeElement !== canvas) return;
    const keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', '+', '=', '-', '_', ' ', 'Enter'];
    if (!keys.includes(e.key)) return;
    e.preventDefault();
    keyboardAim ||= { angle: -Math.PI / 2, power: 80 };
    if (e.key === 'ArrowLeft') keyboardAim.angle -= Math.PI / 36;
    if (e.key === 'ArrowRight') keyboardAim.angle += Math.PI / 36;
    if (e.key === 'ArrowUp') keyboardAim.power = Math.min(P.MAX_PULL, keyboardAim.power + 5);
    if (e.key === 'ArrowDown') keyboardAim.power = Math.max(9, keyboardAim.power - 5);
    if (['+', '='].includes(e.key)) keyboardAim.power = Math.min(P.MAX_PULL, keyboardAim.power + 10);
    if (['-', '_'].includes(e.key)) keyboardAim.power = Math.max(9, keyboardAim.power - 10);
    if (e.key === ' ' || e.key === 'Enter') { fire(currentAim()); return; }
    setPower(keyboardAim.power);
  });
  $('restart').addEventListener('click', () => reset());
  $('new-map').addEventListener('click', () => reset(freshSeed()));
  $('result-retry').addEventListener('click', () => { reset(); canvas.focus({ preventScroll: true }); });
  $('result-new').addEventListener('click', () => { reset(freshSeed()); canvas.focus({ preventScroll: true }); });
  function syncSound() {
    $('sound-toggle').setAttribute('aria-pressed', String(soundOn)); $('sound-toggle').setAttribute('aria-label', soundOn ? '효과음 끄기' : '효과음 켜기');
    $('sound-waves').setAttribute('d', soundOn ? 'M15 8Q20 12 15 16M18 5Q25 12 18 19' : 'M16 9L21 15M21 9L16 15');
  }
  $('sound-toggle').addEventListener('click', () => { soundOn = !soundOn; syncSound(); if (soundOn) sound('defeat'); });
  document.addEventListener('visibilitychange', () => { lastFrame = 0; accumulator = 0; if (document.hidden) cancelAim(); });

  function frame(timestamp) {
    const dt = lastFrame ? Math.min((timestamp - lastFrame) / 1000, .05) : 0;
    lastFrame = timestamp; totalTime += dt; accumulator += dt; forecastAge += dt;
    while (accumulator >= 1 / 120) {
      P.step(state, 1 / 120); handleEvents(); accumulator -= 1 / 120;
    }
    if (state.phase === 'moving') { trail.push({ x: state.player.x, y: state.player.y }); if (trail.length > 16) trail.shift(); }
    updateEffects(dt); syncUi(); updateForecast();
    C.follow(camera, state.player);
    ctx.setTransform(canvas.width / VW, 0, 0, canvas.height / VH, 0, 0);
    ctx.clearRect(0, 0, VW, VH); ctx.fillStyle = '#778560'; ctx.fillRect(0, 0, VW, VH); ctx.save();
    const view = C.transform(camera); ctx.translate(view.ox, view.oy); ctx.scale(view.scale, view.scale);
    ctx.drawImage(floor, 0, 0);
    drawEnemyIntents();
    for (const enemy of state.enemies.filter(e => e.alive).sort((a, b) => a.y - b.y)) drawStone(enemy.x, enemy.y, enemy.r, enemy.level, enemy.shape);
    drawMergeForecast(); drawAim(); drawPlayer(); drawEffects(); ctx.restore();
    requestAnimationFrame(frame);
  }
  function resizeViewport() {
    const rect = canvas.getBoundingClientRect();
    const scale = 720 / Math.max(1, Math.min(rect.width, rect.height));
    VW = rect.width * scale; VH = rect.height * scale;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    camera.width = VW; camera.height = VH;
    cancelAim();
    if (state) C.follow(camera, state.player);
  }
  new ResizeObserver(resizeViewport).observe($('arena-wrap'));
  resizeViewport(); reset(); requestAnimationFrame(frame);
})();

</script>
