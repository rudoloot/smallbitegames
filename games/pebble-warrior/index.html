  function burst(x,y,color='#d9c68d',count=12) {

      const a=Math.random()*Math.PI*2,v=35+Math.random()*120;

  function updateEffects(dt) {
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;}
    particles=particles.filter(p=>p.life>0);
    for(const e of effects){e.life-=dt;e.y-=25*dt;}
    effects=effects.filter(e=>e.life>0);
    if(toastTime>0&&(toastTime-=dt)<=0)$('toast').classList.remove('visible');
    if(bannerTime>0&&(bannerTime-=dt)<=0)$('stage-banner').classList.remove('visible');

  function drawEffects() {

    for(const e of effects){c.globalAlpha=Math.min(1,e.life*2);c.font=`800 ${e.big?25:18}px system-ui`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=4;c.strokeStyle='#f4efd8cf';c.strokeText(e.text,e.x,e.y);c.fillStyle=e.color;c.fillText(e.text,e.x,e.y);}

  function sound(kind) {
    if(!soundOn)return;
    try{
      audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();
      const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();
      const f={hit:380,crit:640,hurt:115,defeat:500,item:720,launch:240,wall:155,clear:820,rune:600}[kind]||300;
      osc.type=kind==='hurt'?'triangle':'sine';osc.frequency.setValueAtTime(f,now);osc.frequency.exponentialRampToValueAtTime(f*(kind==='hurt'?.5:1.25),now+.12);
      gain.gain.setValueAtTime(.035,now);gain.gain.exponentialRampToValueAtTime(.001,now+.18);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(now+.2);
    }catch{soundOn=false;syncSound();}
  }
  function handleEvents() {
    for(const e of state.events.splice(0)){
      if(e.type==='stage_start'){paintFloor();announceStage();trail=[];bannerTime=2.5;}
      else if(e.type==='launch'){sound('launch');$('stage-banner').classList.remove('visible');bannerTime=0;}
      else if(e.type==='hit'){float(`${e.knockback?'충돌 ':''}${e.crit?'✦ ':''}${e.amount}`,e.x,e.y-35,e.crit?'#ad7133':'#49603a',e.crit);burst(e.x,e.y,e.crit?'#ead089':'#c1cb9c',e.crit?13:6);sound(e.crit?'crit':'hit');}
      else if(e.type==='hurt'){float(`−${e.amount}`,e.x,e.y-37,'#b54e3a',true);burst(e.x,e.y,'#d3a079',9);sound('hurt');}
      else if(e.type==='dodge')float('회피',e.x,e.y-34,'#538e83');
      else if(e.type==='immune')float('무적',e.x,e.y-32,'#b28e35');
      else if(e.type==='defeat'){burst(e.x,e.y,e.boss?'#e4c576':'#c0b886',e.boss?28:16);float(`◆ +${e.crystals}`,e.x,e.y-5,'#5e8d8f');sound('defeat');}
      else if(e.type==='box_break'){burst(e.x,e.y,'#d6b37b',18);sound('item');}
      else if(e.type==='reinforcements'){for(const p of e.positions)burst(p.x,p.y,'#b79ac8',7);}
      else if(e.type==='item'){toast(`${e.name} 획득`);sound('item');}
      else if(e.type==='rune'){toast('광전사의 룬 · 이번 샷 무적');sound('rune');}
      else if(e.type==='clear'){
        trail=[];cancelAim();sound('clear');
        if(e.final){resultTime=.75;try{localStorage.removeItem('pebble-warrior-v3');}catch{}}
        else {renderShop();checkpoint(true);}
      }else if(e.type==='lose'){cancelAim();resultTime=.8;try{localStorage.removeItem('pebble-warrior-v3');}catch{}}
      else if(e.type==='wall')sound('wall');
    }
  }

    canvas.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});
  });
  canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const p=position(e);drag.x=p.x;drag.y=p.y;setPower(Math.hypot(drag.startX-drag.x,drag.startY-drag.y));});
  canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const p=position(e);drag.x=p.x;drag.y=p.y;const aim=currentAim();drag=null;canvas.releasePointerCapture(e.pointerId);fire(aim);});
  canvas.addEventListener('pointercancel',cancelAim);canvas.addEventListener('lostpointercapture',()=>{if(drag)cancelAim();});
  window.addEventListener('blur',cancelAim);
  function closeStats() {statsOpen=false;$('stats-overlay').hidden=true;canvas.focus({preventScroll:true});}
  function openStats(){cancelAim();statsOpen=true;renderStats();$('stats-overlay').hidden=false;$('stats-close').focus({preventScroll:true});}
  function closePause(){paused=false;$('pause-overlay').hidden=true;canvas.focus({preventScroll:true});}
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape') {cancelAim();if(statsOpen)closeStats();else if(paused)closePause();return;}
    if(blocked()||document.activeElement!==canvas)return;
    const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','_',' ','Enter','x','X','q','Q'];if(!keys.includes(e.key))return;e.preventDefault();
    if(e.key.toLowerCase()==='x'){cancelAim();P.wait(state);handleEvents();syncUi();return;}
    if(e.key.toLowerCase()==='q'){P.useRune(state);handleEvents();syncUi();checkpoint(true);return;}
    keyboardAim||={angle:-Math.PI/2,power:95};
    if(e.key==='ArrowLeft')keyboardAim.angle-=Math.PI/36;
    if(e.key==='ArrowRight')keyboardAim.angle+=Math.PI/36;
    if(['ArrowUp','+','='].includes(e.key))keyboardAim.power=Math.min(P.MAX_PULL,keyboardAim.power+6);
    if(['ArrowDown','-','_'].includes(e.key))keyboardAim.power=Math.max(9,keyboardAim.power-6);
    if(e.key===' '||e.key==='Enter'){fire(currentAim());return;}setPower(keyboardAim.power);
  });
  $('wait-turn').addEventListener('click',()=>{if(blocked())return;cancelAim();P.wait(state);handleEvents();syncUi();canvas.focus({preventScroll:true});});
  $('rune-use').addEventListener('click',()=>{if(blocked())return;P.useRune(state);handleEvents();syncUi();checkpoint(true);canvas.focus({preventScroll:true});});
  $('stats-open').addEventListener('click',openStats);$('shop-stats').addEventListener('click',openStats);$('stats-close').addEventListener('click',closeStats);
  $('stats-overlay').addEventListener('click',e=>{if(e.target===$('stats-overlay'))closeStats();});
  $('pause-open').addEventListener('click',()=>{if(['shop','won','lost'].includes(state.phase))return;cancelAim();paused=true;$('pause-overlay').hidden=false;$('resume').focus({preventScroll:true});});
  $('resume').addEventListener('click',closePause);
  $('restart').addEventListener('click',()=>{reset();canvas.focus({preventScroll:true});});
  $('new-map').addEventListener('click',()=>{reset(freshSeed());canvas.focus({preventScroll:true});});
  $('result-retry').addEventListener('click',()=>{reset();canvas.focus({preventScroll:true});});
  $('result-new').addEventListener('click',()=>{reset(freshSeed());canvas.focus({preventScroll:true});});
  $('shop-reroll').addEventListener('click',()=>{if(P.rerollShop(state)){renderShop();syncUi();checkpoint(true);}});
  $('next-stage').addEventListener('click',()=>{
    if(P.nextStage(state)){$('shop-overlay').hidden=true;cancelAim();effects=[];particles=[];trail=[];handleEvents();syncUi();checkpoint(true);canvas.focus({preventScroll:true});}
  });
  function syncSound(){$('sound-toggle').setAttribute('aria-pressed',String(soundOn));$('sound-toggle').setAttribute('aria-label',soundOn?'효과음 끄기':'효과음 켜기');$('sound-waves').setAttribute('d',soundOn?'M15 8Q20 12 15 16M18 5Q25 12 18 19':'M16 9L21 15M21 9L16 15');}
  $('sound-toggle').addEventListener('click',()=>{soundOn=!soundOn;syncSound();if(soundOn)sound('item');});
  document.addEventListener('visibilitychange',()=>{lastFrame=0;accumulator=0;if(document.hidden){cancelAim();checkpoint(true);}});
  function resizeViewport(){
    const r=canvas.getBoundingClientRect(),scale=720/Math.max(1,Math.min(r.width,r.height)),dpr=Math.min(window.devicePixelRatio||1,2);
    VW=r.width*scale;VH=r.height*scale;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));camera.width=VW;camera.height=VH;cancelAim();if(state)C.follow(camera,state.player);
  }
  function frame(timestamp){
    const dt=lastFrame?Math.min((timestamp-lastFrame)/1000,.05):0;lastFrame=timestamp;time+=dt;
    if(!paused&&!statsOpen){accumulator+=dt;while(accumulator>=1/120){P.step(state,1/120);handleEvents();accumulator-=1/120;}}
    else accumulator=0;
    if(['moving','recoil'].includes(state.phase)){trail.push({x:state.player.x,y:state.player.y});if(trail.length>15)trail.shift();}else trail=[];
    updateEffects(dt);syncUi();checkpoint();C.follow(camera,state.player);
    ctx.setTransform(canvas.width/VW,0,0,canvas.height/VH,0,0);ctx.clearRect(0,0,VW,VH);ctx.fillStyle=P.STAGES[state.stage].outside;ctx.fillRect(0,0,VW,VH);
    ctx.save();ctx.translate(-camera.x,-camera.y);ctx.drawImage(floor,0,0);drawHazards();
    for(const rock of state.rocks){orb(rock.x,rock.y,rock.r,PALETTES.rock);ctx.strokeStyle='#7b8a6c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(rock.x-12,rock.y-4);ctx.lineTo(rock.x,rock.y+8);ctx.lineTo(rock.x+9,rock.y-10);ctx.stroke();}
    for(const b of state.boxes)if(b.alive)drawBox(b);
    for(const e of state.enemies.filter(e=>e.alive).sort((a,b)=>a.y-b.y))drawEnemy(e);
    drawAim();drawPlayer();drawEffects();ctx.restore();drawBossIndicator();
    requestAnimationFrame(frame);
  }
  new ResizeObserver(resizeViewport).observe($('arena-wrap'));
  resizeViewport();if(!restore())reset();requestAnimationFrame(frame);
})();

</script>
<style>.site-return{display:block;width:100%;margin-top:12px;text-align:center}</style>
<script>(()=>{let target=null;try{const raw=new URLSearchParams(location.search).get('returnTo');if(raw){const url=new URL(raw);if(url.protocol==='https:'&&url.origin===location.origin&&!url.username&&!url.password)target=url;}}catch{}if(!target)return;for(const [selector,id] of [['.pause-panel','site-exit'],['.shop-bottom','site-exit-shop'],['.result-panel','site-exit-result']]){const panel=document.querySelector(selector);if(!panel)continue;const button=document.createElement('button');button.id=id;button.type='button';button.className='text-button site-return';button.textContent='사이트로 돌아가기';button.addEventListener('click',()=>location.replace(target.href));panel.append(button);}})();</script>
