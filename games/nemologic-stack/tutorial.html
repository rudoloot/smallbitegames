둘째 줄 가운데를 지워볼게요. X를 넣는 것과 달리, 아직 결정하지 않은 빈칸으로 돌아가요.","target":"erase","value":"erase","action":[[7,null]],"note":"지우개를 고른 뒤 표시된 칸을 누르거나 다음을 눌러요."},{"title":"되돌리기로 방금 작업을 취소해요","text":"방금 지운 칸을 되돌리면 원래의 1로 돌아와요. 실제 게임에서는 한 번의 드래그도 되돌리기 한 번으로 취소할 수 있어요.","target":"undo","action":[[7,1]],"note":"되돌리기를 누르거나 다음을 눌러 복원해요."},{"title":"선택은 숫자를 바꾸지 않아요","text":"선택 도구로는 입력값을 바꾸지 않고 칸을 살펴봐요. 칸을 눌러 보세요. 가로·세로 단서와 값이 맞으면 그림 완성이에요!","target":"select","value":"select"},{"title":"그림 완성! 이제 직접 풀어봐요","text":"밝은 회색에서 검정까지, 명암을 쌓아 숨은 그림을 찾았어요. 흑백게임에서는 같은 방법으로 10×10 그림에 도전할 수 있어요.","target":"complete"}],"pictureName":"하트","storageKey":"nonogram-stack-tutorial-v1"};</script><script>(function(root){

  }
  function enter(){tool=steps[step].value??'select';selected=null;render();save();}
  function change(patches){const changes=patches.filter(([i,v])=>board[i]!==v).map(([i,v])=>({i,before:board[i],after:v}));if(changes.length){history.push(changes);for(const c of changes)board[c.i]=c.after;}render();save();}
  $('next').onclick=()=>{
    if(step===steps.length-1){const destination=new URL('collection.html#monochrome',location.href);destination.search=location.search;location.href=destination.href;return;}
    for(const [i,v] of steps[step].action||[])board[i]=v;
    step++;history=[];enter();
  };
  $('previous').onclick=()=>{if(step===0)return;step--;board=canonical(step);history=[];enter();};
  $('restart').onclick=()=>{step=0;board=canonical(0);history=[];enter();};
  for(const button of document.querySelectorAll('[data-tool]'))button.onclick=()=>{tool=/^\d$/.test(button.dataset.tool)?Number(button.dataset.tool):button.dataset.tool;render();};
  $('tutorial-board').onclick=e=>{
    const cell=e.target.closest('[data-index]');if(!cell||step===steps.length-1)return;const i=Number(cell.dataset.index);selected=i;
    if(tool==='select'){render();return;}
    const expected=steps[step].action?.find(([p])=>p===i),value=tool==='erase'?null:tool;
    if(expected&&expected[1]===value)change([[i,value]]);
    else{render();$('step-note').textContent='말풍선에서 안내하는 도구와 초록 테두리 칸을 따라가 보세요. 다음을 눌러 함께 채울 수도 있어요.';}
  };
  $('tutorial-undo').onclick=()=>{
    if(steps[step].target==='undo'){change([[7,1]]);return;}
    const changes=history.pop();if(!changes)return;for(const c of changes)board[c.i]=c.before;render();save();
  };
  function fitBoard(){
    const dock=document.querySelector('.lesson-dock').getBoundingClientRect(),grid=$('tutorial-board');
    document.documentElement.style.setProperty('--lesson-dock-height',dock.height+'px');
    if(innerWidth>=700){grid.style.removeProperty('--tutorial-board-width');return;}
    const captionSpace=$('picture-name').hidden?0:$('picture-name').getBoundingClientRect().height+12;
    const available=innerHeight-dock.height-(grid.getBoundingClientRect().top+scrollY)-16-captionSpace;
    const width=Math.min(document.querySelector('.lesson-heading').clientWidth,76+5*Math.max(24,(available-96)/5));
    grid.style.setProperty('--tutorial-board-width',width+'px');
  }
  new ResizeObserver(fitBoard).observe(document.querySelector('.lesson-dock'));
  addEventListener('resize',fitBoard);
  enter();
})();
</script><script src="site-integration.js?v=db552d20a06e" defer></script></body></html>
