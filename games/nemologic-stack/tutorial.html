    }
    for(let i=0;i<25;i++){
      const v=board[i],level=v===null?null:255-v*85;
      const content=done||v===null?'':v===0?'<svg class="cell-cross" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2L22 22M22 2L2 22"/></svg>':v;
      html+=`<button class="cell ${i%5===0?'first-col':''} ${i<5?'first-row':''} ${targets.has(i)?'guided':''} ${selected===i?'selected':''}" data-index="${i}" style="grid-row:${Math.floor(i/5)+2};grid-column:${i%5+2};${level!==null?'background:rgb('+[level,level,level].join(',')+');color:'+(v>=2?'#fff':'#555')+';':''}" aria-label="${Math.floor(i/5)+1}행 ${i%5+1}열 ${v===null?'미정':v+'스택'}${targets.has(i)?', 안내 칸':''}" aria-pressed="${selected===i}">${content}</button>`;
    }
    html+='<div class="corner" style="grid-row:7;grid-column:1" aria-hidden="true"></div>';
    const focus=document.activeElement?.dataset.index;
    $('tutorial-board').innerHTML=html;$('tutorial-board').classList.toggle('intro',current.target==='board');$('tutorial-board').classList.toggle('finished',done);
    if(focus!==undefined)$('tutorial-board').querySelector(`[data-index="${focus}"]`)?.focus({preventScroll:true});
    $('step-count').textContent=`${step+1} / ${steps.length}`;$('step-title').textContent=current.title;$('step-text').textContent=current.text;$('step-note').textContent=current.note||'';
    const example=$('step-example');example.hidden=!current.example;
    example.innerHTML=current.example?current.example.groups.map(group=>'<span class="example-group">'+group.map(v=>`<span class="example-cell" style="background:rgb(${Array(3).fill(255-v*85).join(',')});color:${v>=2?'#fff':'#333'}">${v===0?'×':v}</span>`).join('')+'</span>').join('')+`<strong>${current.example.result}</strong>`:'';
    const solved=board.every((v,i)=>v===answer[i]);
    $('picture-name').hidden=!solved;$('picture-name').textContent=solved?TUTORIAL.pictureName:'';
    $('previous').disabled=step===0;$('next').textContent=done?'흑백게임 시작 →':'다음 →';
    for(const button of document.querySelectorAll('[data-tool]')){
      const value=button.dataset.tool;
      button.classList.toggle('current',value===String(tool));button.setAttribute('aria-pressed',value===String(tool));
      button.classList.toggle('guided',current.target==='values'&&/^\d$/.test(value)||current.value!==undefined&&String(current.value)===value);
    }
    $('tutorial-undo').classList.toggle('guided',current.target==='undo');$('tutorial-undo').disabled=!history.length&&current.target!=='undo';
    fitBoard();
  }
  function enter(){tool=steps[step].value??'select';selected=null;render();save();}
  function change(patches){const changes=patches.filter(([i,v])=>board[i]!==v).map(([i,v])=>({i,before:board[i],after:v}));if(changes.length){history.push(changes);for(const c of changes)board[c.i]=c.after;}render();save();}
  $('next').onclick=()=>{
    if(step===steps.length-1){const destination=new URL('collection.html#monochrome',location.href);destination.search=location.search;location.href=destination.href;return;}
    for(const [i,v] of steps[step].action||[])board[i]=v;
    step++;history=[];enter();
  };
  $('previous').onclick=()=>{if(step===0)return;step--;board=canonical(step);history=[];enter();};
  $('restart').onclick=()=>{step=0;board=canonical(0);history=[];enter();};
  for(const button of document.querySelectorAll('[data-tool]'))button.onclick=()=>{tool=/^\d$/.test(button.dataset.tool)?Number(button.dataset.tool):button.dataset.tool;render();};
  $('tutorial-board').onclick=e=>{
    const cell=e.target.closest('[data-index]');if(!cell||step===steps.length-1)return;const i=Number(cell.dataset.index);selected=i;
    if(tool==='select'){render();return;}
    const expected=steps[step].action?.find(([p])=>p===i),value=tool==='erase'?null:tool;
    if(expected&&expected[1]===value)change([[i,value]]);
    else{render();$('step-note').textContent='말풍선에서 안내하는 도구와 초록 테두리 칸을 따라가 보세요. 다음을 눌러 함께 채울 수도 있어요.';}
  };
  $('tutorial-undo').onclick=()=>{
    if(steps[step].target==='undo'){change([[7,1]]);return;}
    const changes=history.pop();if(!changes)return;for(const c of changes)board[c.i]=c.before;render();save();
  };
  function fitBoard(){
    const dock=document.querySelector('.lesson-dock').getBoundingClientRect(),grid=$('tutorial-board');
    document.documentElement.style.setProperty('--lesson-dock-height',dock.height+'px');
    if(innerWidth>=700){grid.style.removeProperty('--tutorial-board-width');return;}
    const captionSpace=$('picture-name').hidden?0:$('picture-name').getBoundingClientRect().height+12;
    const available=innerHeight-dock.height-(grid.getBoundingClientRect().top+scrollY)-16-captionSpace;
    const width=Math.min(document.querySelector('.lesson-heading').clientWidth,54+5*Math.max(8,(available-64)/5));
    grid.style.setProperty('--tutorial-board-width',width+'px');
    grid.style.setProperty('--tutorial-cell-size',(width-54)/5+'px');
  }
  new ResizeObserver(fitBoard).observe(document.querySelector('.lesson-dock'));
  addEventListener('resize',fitBoard);
  enter();
  const undoTutorial=$('tutorial-undo').onclick;
  window.installStackDpad({
    dpad:$('tutorial-dpad'),buttons:[...document.querySelectorAll('.tutorial-tools button')],
    move:direction=>{const i=selected??0,row=Math.floor(i/5),col=i%5;selected=direction==='up'?Math.max(0,row-1)*5+col:direction==='down'?Math.min(4,row+1)*5+col:direction==='left'?row*5+Math.max(0,col-1):row*5+Math.min(4,col+1);render();},
    choose:button=>{if(button.dataset.tool!==undefined){tool=/^\d$/.test(button.dataset.tool)?Number(button.dataset.tool):button.dataset.tool;render();}},
    apply:button=>{if(button.id==='tutorial-undo'){const cursor=selected;undoTutorial();selected=cursor;render();return;}selected??=0;$('tutorial-board').querySelector(`[data-index="${selected}"]`).click();}
  });
})();
</script><script src="site-integration.js?v=252f7f3518dd" defer></script></body></html>
