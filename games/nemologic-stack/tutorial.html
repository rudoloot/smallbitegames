<body><main class="tutorial-app"><header class="header"></header>
<div class="lesson-heading"><span>5×5 튜토리얼</span><button id="restart">다시 배우기</button></div>
<section id="tutorial-board" class="board" aria-label="5행 5열 명암 퍼즐"></section>
<p id="picture-name" class="picture-name" aria-live="polite" hidden></p>
<div class="lesson-dock"><div class="tutorial-gamepad"><div id="tutorial-dpad" class="dpad" role="group" tabindex="0" aria-label="칸 이동 십자키"></div><div class="tutorial-tools" aria-label="높이 입력"><button id="tutorial-undo" aria-label="되돌리기">↶ undo</button><button data-tool="erase" aria-label="지우개">지우개</button><button data-tool="0" aria-label="0 흰색"><strong>×</strong></button><button data-tool="1" aria-label="1 밝은 회색"><strong>1</strong></button><button data-tool="2" aria-label="2 어두운 회색"><strong>2</strong></button><button data-tool="3" aria-label="3 검정"><strong>3</strong></button></div></div>
<aside class="speech-bubble" aria-label="튜토리얼 안내"><div class="speech-copy" aria-live="polite" aria-atomic="true"><span id="step-count"></span><h2 id="step-title"></h2><p id="step-text"></p><div id="step-example" class="step-example" hidden></div><p id="step-note"></p></div><div class="step-actions"><button id="previous">이전</button><button id="next">다음 →</button></div></aside></div>
</main><script>/* Shared navigation and two-pointer game controls. Inlined by the builders. */
(() => {
  const header=document.querySelector('main > header');
  if(!header)return;
  const isMenu=!!document.querySelector('#monochrome-games');
  const mode=()=>isMenu?(document.body.dataset.mode||'monochrome'):
    document.body.classList.contains('monochrome-game')||document.querySelector('.tutorial-app')?'monochrome':'color';
  const icon=path=>`<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${path}</svg>`;
  const pixelGlyphs={
    N:['10001','11001','10101','10011','10001','10001','10001','00000'],
    o:['00000','00000','01110','10001','10001','10001','01110','00000'],
    n:['00000','00000','11110','10001','10001','10001','10001','00000'],
    g:['00000','00000','01111','10001','10001','01111','00001','01110'],
    r:['00000','00000','10110','11001','10000','10000','10000','00000'],
    a:['00000','00000','01110','00001','01111','10001','01111','00000'],
    m:['00000','00000','11010','10101','10101','10101','10101','00000'],
    S:['01111','10000','10000','01110','00001','00001','11110','00000'],
    t:['00100','00100','11111','00100','00100','00100','00011','00000'],
    c:['00000','00000','01111','10000','10000','10000','01111','00000'],
    k:['10000','10000','10010','10100','11000','10100','10010','00000']
  };
  let pen=0;
  const pixelLetters=['Nono','gram','Stack'].map((word,tone)=>{
    let path='';
    for(const letter of word){
      pixelGlyphs[letter].forEach((row,y)=>[...row].forEach((pixel,x)=>{if(pixel==='1')path+=`M${pen+x} ${y}h1v1h-1Z`;}));
      pen+=6;
    }
    return `<path class="wordmark-tone" data-tone="${tone}" d="${path}"/>`;
  }).join('');
  const pixelLogo=`<svg class="wordmark-logo" viewBox="0 0 77 8" width="154" height="16" shape-rendering="crispEdges" aria-hidden="true"><defs><linearGradient id="wordmark-rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="77" y2="0"><stop offset="0" stop-color="#d64d55"/><stop offset=".16" stop-color="#df8739"/><stop offset=".33" stop-color="#91a83e"/><stop offset=".5" stop-color="#409665"/><stop offset=".66" stop-color="#398fba"/><stop offset=".83" stop-color="#6f68bb"/><stop offset="1" stop-color="#b559a5"/></linearGradient></defs>${pixelLetters}</svg>`;
  const wordmarkTag=isMenu?'button':'div';
  header.className='header shared-header';
  header.innerHTML=`<${wordmarkTag} class="wordmark" id="mode-toggle">${pixelLogo}<span class="wordmark-text">NonogramStack</span></${wordmarkTag}><div class="header-actions"><button class="nav-icon" id="settings" aria-label="설정">${icon('<path d="m9 3-1 3-3 1-2 3 2 2v3l3 2 1 3h6l1-3 3-2v-3l2-2-2-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/>')}</button><button class="nav-icon" id="navigate-back" aria-label="뒤로가기">${icon('<path d="m14 5-7 7 7 7M7 12h14"/>')}</button></div>`;
  const dialog=document.createElement('dialog');dialog.id='settings-dialog';
  dialog.innerHTML='<div class="settings-top"><h2>설정</h2><button class="nav-icon" aria-label="설정 닫기">×</button></div><label class="settings-option"><input type="checkbox" id="show-input-guide"> 조작 안내 표시</label><p class="control-guide">왼쪽 십자키로 칸을 이동해요. 오른쪽 버튼을 누른 채 이동하면 지나가는 칸마다 입력해요. 방향 버튼을 1초 이상 누르면 0.2초마다 반복 이동해요. 게임판을 직접 누르면 터치 모드가 되어 오른쪽 버튼으로 값만 선택하고 칸을 터치해서 입력해요. 십자키를 다시 누르면 십자키 모드로 돌아가요.</p><div class="settings-actions"></div>';
  document.body.append(dialog);
  dialog.querySelector('.nav-icon').onclick=()=>dialog.close();
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
  const guide=dialog.querySelector('input');guide.checked=true;
  try{guide.checked=localStorage.getItem('nonogram-stack-input-guide')!=='false';}catch{}
  const updateGuide=()=>document.body.classList.toggle('hide-input-guide',!guide.checked);
  updateGuide();guide.onchange=()=>{updateGuide();try{localStorage.setItem('nonogram-stack-input-guide',String(guide.checked));}catch{}};
  for(const [id,label] of [['help-dialog','게임 방법'],['reset-dialog','처음부터 다시 풀기']]){
    if(!document.getElementById(id))continue;
    const button=document.createElement('button');button.textContent=label;button.onclick=()=>{dialog.close();document.getElementById(id).showModal();};dialog.querySelector('.settings-actions').append(button);
  }
  document.getElementById('settings').onclick=()=>dialog.showModal();
  window.updateStackModeLabel=()=>{
    const current=mode();document.getElementById('mode-toggle').dataset.mode=current;
    if(isMenu)document.getElementById('mode-toggle').setAttribute('aria-label',`NonogramStack · ${current==='color'?'흑백':'컬러'} 게임으로 전환`);
  };
  if(isMenu)document.getElementById('mode-toggle').onclick=()=>{
    const next=mode()==='color'?'monochrome':'color';
    try{localStorage.setItem('nonogram-stack-mode',next);}catch{}
    window.selectStackMode(next);
  };
  document.getElementById('navigate-back').onclick=()=>{
    if(isMenu){if(history.length>1)history.back();}else location.href='collection.html#'+mode();
  };
  if(isMenu&&history.length<=1)document.getElementById('navigate-back').disabled=true;
  window.updateStackModeLabel();
})();

window.installStackDpad=({dpad,buttons,move,apply,choose=()=>{}})=>{
  const directions=[['up','위로 이동','M6 15l6-6 6 6'],['left','왼쪽으로 이동','M15 6l-6 6 6 6'],['right','오른쪽으로 이동','M9 6l6 6-6 6'],['down','아래로 이동','M6 9l6 6 6-6']];
  dpad.innerHTML=directions.map(([value,label,path])=>`<button type="button" data-direction="${value}" aria-label="${label}" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="${path}"/></svg></button>`).join('')+'<span class="dpad-center" aria-hidden="true"></span>';
  const directionButtons=[...dpad.querySelectorAll('[data-direction]')];
  let directionPointer=null,actionPointer=null,held=null,timer=0,repeatDelay=0,direction='';
  function step(value=direction){if(!value||document.querySelector('dialog[open]'))return;const moved=move(value);if(held!==null&&moved!==false)apply(held);}
  function setDirection(value){
    if(value===direction)return;
    direction=value;
    directionButtons.forEach(button=>{const active=button.dataset.direction===value;button.classList.toggle('held',active);button.setAttribute('aria-pressed',active);});
  }
  function beginDirection(value){
    setDirection(value);step();
    repeatDelay=setTimeout(()=>{
      repeatDelay=0;
      if(directionPointer===null)return;
      step();timer=setInterval(()=>step(),200);
    },1000);
  }
  function stopDirection(){clearTimeout(repeatDelay);repeatDelay=0;clearInterval(timer);timer=0;setDirection('');directionPointer=null;}
  function stopAction(){buttons.forEach(b=>b.classList.remove('held'));held=null;actionPointer=null;}
  dpad.addEventListener('pointerdown',e=>{const button=e.target.closest('[data-direction]');if(!button||directionPointer!==null||e.button!==0||document.querySelector('dialog[open]'))return;e.preventDefault();directionPointer=e.pointerId;dpad.setPointerCapture(e.pointerId);beginDirection(button.dataset.direction);});
  dpad.addEventListener('pointermove',e=>{if(e.pointerId!==directionPointer)return;e.preventDefault();const button=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-direction]');setDirection(button&&dpad.contains(button)?button.dataset.direction:'');});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])dpad.addEventListener(event,e=>{if(e.pointerId===directionPointer)stopDirection();});
  dpad.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();e.stopPropagation();step(d);}});
  dpad.addEventListener('click',e=>{const button=e.target.closest('[data-direction]');if(button&&e.detail===0)step(button.dataset.direction);});
  dpad.addEventListener('contextmenu',e=>e.preventDefault());
  for(const button of buttons){
    button.onclick=e=>{if(e.detail===0&&!button.disabled){choose(button);apply(button);}};
    button.addEventListener('pointerdown',e=>{if(actionPointer!==null||e.button!==0||button.disabled||document.querySelector('dialog[open]'))return;e.preventDefault();actionPointer=e.pointerId;held=button;button.setPointerCapture(e.pointerId);button.classList.add('held');choose(button);apply(button);});
    for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>{if(e.pointerId===actionPointer)stopAction();});
    button.addEventListener('contextmenu',e=>e.preventDefault());
  }
  const stop=()=>{stopDirection();stopAction();};
  addEventListener('blur',stop);addEventListener('pagehide',stop);addEventListener('resize',stop);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  new MutationObserver(()=>{if(document.querySelector('dialog[open]'))stop();}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['open']});
  return stop;
};
