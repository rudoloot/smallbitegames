<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5ef">
  <title>NonogramStack</title>
    <link rel="stylesheet" href="style.css?v=cb05b2c165e8">
  <link rel="stylesheet" href="terrain.css?v=cb05b2c165e8">
  <link rel="stylesheet" href="layout.css?v=cb05b2c165e8">
  <link rel="stylesheet" href="bull-game.css?v=cb05b2c165e8">
  <link rel="stylesheet" href="fruit-game.css?v=cb05b2c165e8">
  <link rel="stylesheet" href="shared-ui.css?v=cb05b2c165e8">
</head>
<body class="individual-sums stack-sum-game" data-loading>
<p id="game-loading" role="status">문제를 불러오는 중입니다.</p>
<section id="game-load-error" role="alert" hidden><h1></h1><p></p><button id="retry-game">다시 시도</button><a href="collection.html">문제 목록으로</a></section>
<main class="app">
  <header class="header"></header>
  <div class="play-area">
  <section id="editor-panel" aria-label="색상별 스택 입력">
  <nav class="tabs" aria-label="색상 탭" role="tablist">
    <button id="tab-0" role="tab" data-tab="0" aria-controls="game-panel" aria-selected="true"><span class="dot red"></span>빨강</button>
    <button id="tab-1" role="tab" data-tab="1" aria-controls="game-panel" aria-selected="false"><span class="dot green"></span>녹색</button>
    <button id="tab-2" role="tab" data-tab="2" aria-controls="game-panel" aria-selected="false"><span class="dot blue"></span>파랑</button>
    <button id="tab-all" role="tab" data-tab="all" aria-controls="terrain-panel" aria-selected="false"><span class="all-dot"></span>전체</button>
  </nav>
  <section id="game-panel" role="tabpanel" aria-labelledby="tab-0" aria-label="빨강 퍼즐">

    <div id="board-viewport"><div id="board" class="board" role="group" aria-label="10행 10열 피크로스"></div></div>
    <div class="under-board"><span>위·왼쪽 <b>연속 칸 수</b></span><span>아래·오른쪽 <b>최대 높이</b></span></div>
    <div id="diagonals" class="diagonals" hidden></div>
  </section>
  <section id="terrain-panel" role="tabpanel" aria-labelledby="tab-all" aria-label="RGB 전체뷰" hidden>
    <div class="overview-stage"><svg id="overview-svg" role="group"></svg></div>
  </section>
  <div id="message" class="message sr-only" aria-live="polite">같은 높이 구간의 스택 합계와 최대 높이를 단서로 시작해 보세요.</div>
  </section>
  </div>
  <div class="input-dock">
  <section class="input-panel" aria-label="높이 입력">
    <div class="gamepad">
    <div id="dpad-area" class="dpad-area"><div id="dpad" class="dpad" role="group" tabindex="0" aria-label="칸 이동 십자키. 방향키로도 이동할 수 있어요"></div></div>
    <div class="height-picker" id="height-picker" aria-label="입력할 스택 선택">
      <button id="undo" aria-label="되돌리기"><strong aria-hidden="true">↶</strong><span>undo</span></button>
      <button id="erase" aria-label="지우개 선택"><strong><svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 19-6-6a2 2 0 0 1 0-3l7-7a2 2 0 0 1 3 0l8 8a2 2 0 0 1 0 3l-5 5H9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m7 6 11 11M8 19h13" stroke="currentColor" stroke-width="1.6"/></svg></strong><span>지우개</span></button>
      <button data-value="0"><strong>×</strong></button>
      <button data-value="1"><strong>1</strong></button>
      <button data-value="2"><strong>2</strong></button>
      <button data-value="3"><strong>3</strong></button>
    </div>
    </div>
  </section>
  </div>
</main>
<dialog id="help-dialog"></dialog>
<dialog id="reset-dialog"><span class="eyebrow">START AGAIN</span><h2>처음부터 다시 풀까요?</h2><p>입력한 높이를 모두 지우고 빈 보드에서 시작해요.</p><div class="dialog-actions"><button data-close="reset-dialog">계속 풀기</button><button class="primary-button" id="confirm-reset">다시 시작</button></div></dialog>
<dialog id="win-dialog"><span class="eyebrow">PICTURE COMPLETE</span><h2>숨은 그림을 찾았어요!</h2><canvas id="win-art" width="300" height="300"></canvas><p id="win-description"></p><button class="primary-button" data-close="win-dialog">완성된 그림 보기</button><a id="next-puzzle" class="collection-next"></a></dialog>
<script src="puzzle-core-height-runs.js?v=cb05b2c165e8" defer></script>
<script src="puzzle-core-stack-sums.js?v=cb05b2c165e8" defer></script>
<script src="puzzle-core-monochrome.js?v=cb05b2c165e8" defer></script>
<script src="game-loader.js?v=cb05b2c165e8" defer></script>
<script src="site-integration.js?v=dacbb54041b7" defer></script></body>
</html>
