<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('scene'),ctx=canvas.getContext('2d');
const testMode=new URLSearchParams(location.search).get('test')??'combo';
const diveMission=testMode==='dive';
function loadEditorSections(){
 if(diveMission)return [diveSection()];
 if(testMode!=='editor')return [];
 const data=JSON.parse(decodeURIComponent(location.hash.slice(1)));
 const sections=Array.isArray(data)?[{origin:{x:0,y:0,z:0,yaw:0,pitch:0,width:12},
   pieces:data.map(([length,turn,tilt,ramp])=>({length,turn,tilt,ramp}))}]:data.sections;
 return sections.filter(r=>r.pieces.length).map(({origin,pieces})=>{
   const route=buildCourseSection(origin,pieces);
   const points=route.path.map(p=>({x:p.x,z:p.z,h:-p.y,yaw:p.yaw*Math.PI/180,pitch:p.pitch*Math.PI/180,width:p.width}));
   const objects=new Map();
   for(const k of route.ramps)for(let m=k.a;m<k.b;m++){
     if(!objects.has(m))objects.set(m,[]);objects.get(m).push(k);
   }
   const buses=[],busMetres=new Map();
   route.pieces.forEach((piece,i)=>{
     if(piece.bus==null)return;
     const bus=courseBus(route.spans[i]-1,piece.length,piece.bus);
     buses.push(bus);
     for(let m=bus.a;m<bus.b;m++)busMetres.set(m,bus);
   });
   const railMetres=new Map();
   for(const r of route.railRuns)for(let m=r.a;m<r.b;m++){
     if(!railMetres.has(m))railMetres.set(m,[]);
     railMetres.get(m).push(r);
   }
   return {points,ramps:route.ramps,objects,buses,busMetres,railMetres,railRuns:route.railRuns};
 });
}
const editorSections=loadEditorSections(),editorRun=editorSections.length>0;
const lowestEditorSurface=editorSections.reduce((min,r)=>r.points.reduce((h,p)=>Math.min(h,-p.h),min),Infinity);
let ridingSection=0,editorPath=editorSections[0]?.points;
const depthView=diveMission?new DiveDepthView():editorRun?new CourseDepthView():null;
const comboReview=testMode==='combo',trapReview=comboReview||testMode==='traps',routeReview=editorRun||trapReview||testMode==='route';
let songCourse=null;
const railGap={a:926,b:962,restart:848};
let roadHalf=editorRun?6:comboReview?5.25:4.3;
const flatJumpHeight=2,normalGravity=14;
const jumpVelocity=Math.sqrt(2*normalGravity*flatJumpHeight);
const rails=[['A',3.15,14.6,18.25,0.65],['B',-2.35,30.6,34.22,0.85],['C',-2.35,34.86,38.25,0.55],['D',3.15,53.6,56.23,0.7],['E',2.45,65,68,.68],['F',-2.2,78,81,.70],['G',-2.2,81.65,84,.52],['H',2.65,97,100,.75],['I',-2.15,112,115,.65]].map(([name,x,a,b,h])=>({name,x,a:a*12,b:b*12,h}));
const fastRoute=routeReview&&!editorRun;
let FINISH=editorRun?editorPath.length-1:routeReview?2660:1440;
const lateralSpeed=7;
function steerAcross(vx,dt){
 const acceleration=editorRun?24:35;
 return vx+clamp(inputX*lateralSpeed-vx,-acceleration*dt,acceleration*dt);
}
const SPEED=rideStartSpeed;
let LIMIT=editorRun?Math.max(150,Math.ceil(FINISH/SPEED)+30):150;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

let mode='intro',s,inputX=0,duck=false,activePointer=null,camX=0,camY=0,W,H,frameTime=0,audio;

const normalSpeedLimit=Math.max(120/3.6,rideStartSpeed);
function fresh(){return {dive:diveMission?startDive():null,normalSpeed:SPEED,travelYaw:editorRun?editorPath[0].yaw:0,z:0,x:0,y:diveMission?harpoonTop:0,vy:0,time:0,air:false,rail:null,trick:'',trickAge:0,score:0,base:0,types:new Set(),chain:[],grace:0,falls:0,lost:0,recover:0,claimed:new Set(),pending:new Set(),message:'',messageAt:0,slow:0,best:0,speed:SPEED,wall:null,vx:0,airVX:0,airForward:SPEED,roll:0,balance:0,edgeTime:0}}
s=fresh();
function tone(hz,length=.09,slide=1){if(!audio||audio.state!=='running')return;let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=hz;o.frequency.exponentialRampToValueAtTime(hz*slide,audio.currentTime+length);g.gain.value=.075;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+length);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+length)}
function buzz(n){navigator.vibrate?.(n)}
function tell(m){s.message=m;s.messageAt=s.time+1.3}
function skill(name,value,key){if(s.claimed.has(key)||s.pending.has(key))return;s.pending.add(key);s.base+=value;s.types.add(name);s.chain.push(name);s.grace=.9;tone(230+65*s.types.size)}
function clearChain(){s.base=0;s.types.clear();s.chain=[];s.pending.clear();s.grace=0}
function bank(){if(!s.base)return;let gain=s.base*s.types.size;s.score+=gain;s.best=Math.max(s.best,gain);for(const key of s.pending)s.claimed.add(key);clearChain();tell('착지 성공　+'+gain);tone(120,.16,.5);buzz(18)}
const kickers=[
 {a:65,b:72,x:.55,width:1.65,h:.85},
 {a:260,b:269,x:.15,width:2.1,h:1.25},
 {a:148,b:156,x:2.9,width:1.6,h:1},
 {a:320,b:327,x:-.8,width:1.5,h:.95},
 {a:470,b:478,x:.25,width:1.6,h:1.1},
 {a:624,b:632,x:2.8,width:1.6,h:1.2},
 {a:545,b:555,x:-1.1,width:2.3,h:1.5}
];
for(const [a,x,h] of [[752,2.45,1.05],[829,-.4,1.25],[914,-2.2,1.2],[1024,.7,1.35],[1142,2.65,1.12],[1238,-.55,1.45],[1321,-2.15,1.15],[1394,.25,1.25]])
 kickers.push({a,b:a+8,x,width:1.8,h});
function kickerAt(x,z,foot=s?.y){
 return kickers.find(k=>Math.abs(x-k.x)<=k.width/2 && z>=k.a && z<=k.b &&
   (!k.mini||(foot>=reviewSurface(x,z)+(k.base??0)-.12&&foot<=reviewSurface(x,z)+(k.base??0)+k.h+.12)));
}
function rampProgress(k,z){return clamp((z-k.a)/(k.b-k.a),0,1)}
function rampHeight(k,z,x=k.x){
 if(k.sideDirection){
   const across=clamp(.5+k.sideDirection*(x-k.x)/k.width,0,1);
   return k.base+k.h*across*clamp((z-k.a)/3,0,1);
 }
 return (k.base??0)+k.h*rampProgress(k,z)**(k.mini?2:k.angle?1:3)}
function launchFromRamp(k,z,pop=0){
 recordTrail(true,k,z);
 if(k.mini){
   if(k.jumpTransfer){
     // An ollie adds the lift needed to reach the elevated landing.
     if(s.rail?.ramp===k&&pop){
       const t=k.flight,z=s.z+s.speed*t;
       const landingY=k.landingHeight+reviewSurface(k.landingEdgeX,z);
       launch((landingY-s.y)/t+.5*normalGravity*t,(k.landingEdgeX-s.x)/t,s.speed);
     }else{
       const t=k.flight,landingX=k.landingEdgeX+.78*k.sideDirection;
       const target=k.landingHeight+reviewSurface(landingX,s.z+s.speed*t);
       launch((target-s.y)/t+.5*normalGravity*t+(pop-jumpVelocity),(landingX-s.x)/t,s.speed);
     }
     s.sideLaunchDrift=true;
     return;
   }
   const rise=clamp(s.speed*.12,2.8,3.8);
   launch(k.launchVelocity??(Math.sqrt(2*normalGravity*rise)+pop),s.vx,s.speed);
   return;
 }
 const slope=k.angle?k.h/(k.b-k.a):3*k.h*rampProgress(k,z)**2/(k.b-k.a);
 const forward=s.speed/Math.hypot(1,slope);
 launch(forward*slope+pop+(k.spring?3:0),s.vx,forward);
}
const roofs=[[106,144],[180,218],[224,255],[332,366],[438,470],[568,606],[726,752],[814,848],[880,911],[1038,1074],[1194,1230],[1270,1306],[1380,1410]];
function roofAt(z){return roofs.find(([a,b])=>z>=a&&z<b)}
function surface(x,z){if(routeReview){
 const floor=reviewSurface(x,z);
 const support=s.contactDeck;
 const onContact=support&&x>=support.l&&x<=support.r&&z>=support.a&&z<=support.b;
 if(editorRun){
   const ramp=kickerAt(x,z),bus=editorSections[ridingSection].busMetres.get(Math.floor(z));
   const roof=bus&&x>=bus.l&&x<=bus.r?bus.h:0;
   return floor+Math.max(roof,ramp?rampHeight(ramp,z):0);
 }
 if(!comboReview)return floor+(onContact?support.hi:0);
 const block=trackBlockSupport(x,z,s.y);
 const blockHeight=block?trackBlockTop(block,x,z):0;
 const k=kickerAt(x,z);let lift=Math.max(k?rampHeight(k,z,x):0,sideRampHeight(x,z));
 for(const o of streetSlices.get(Math.floor(z/2)*2)||[]){
   if(x<o.left||x>o.right)continue;
   if(['인도','경계석','버스','차양막'].includes(o.kind)&&s.y>=floor+o.h-.035)lift=Math.max(lift,o.h);
 }
 return floor+Math.max(lift,onContact?support.hi:0,blockHeight);
}const d=deckAt(x,z);if(onBus(x,z))return Math.max(bus.h,d?deckHeight(d,z):0);if(d)return deckHeight(d,z);const k=kickerAt(x,z);if(k)return rampHeight(k,z);const r=x < -2.78 && roofAt(z);return r?2.35*Math.min(1,(z-r[0])/9,(r[1]-z)/7):0}
const holes=[
 {a:232,b:237,l:-1.5,r:1.8},{a:675,b:681,l:1.55,r:3.48},
 {a:988,b:994,l:-4.1,r:.6},{a:1352,b:1358,l:-1,r:3.5}
];
const poles=[{z:198,x:.6},{z:506,x:-.8},{z:788,x:1.2},{z:1290,x:-.4}];
const alleys=[454,1000,1300];
function roadLimit(z){
 for(const a of alleys)if(z>=a && z<=a+40)
   return 4.1-2*clamp(Math.min(z-a,a+40-z)/10,0,1);
 return 4.1;
}
function gap(x,z){return holes.some(h=>x>h.l && x<h.r && z>h.a && z<h.b)}

function boardContact(x,y,z,edge){

 if(!speed||Math.abs(cross?lateral:forward)<speed*GRIND_COS-1e-9)return null;

 if(Math.abs(cross?z-edge.z:x-(edge.sideAt?edge.sideAt(z):edge.x))>reach)return null;

 let lo=Math.max(cross?edge.left:edge.a,along-reach);

 if(lo>hi)return null;

 // Clip the segment to the upper half-space of the board/edge contact.
 const top=y+BOARD_HEIGHT,h0=height(lo),h1=height(hi);
 if(Math.min(h0,h1)>top+1e-9)return null;
 if((h0>top)!==(h1>top)){
   const cut=lo+(hi-lo)*(top-h0)/(h1-h0);

 }

 function distance(t){

   return Math.hypot(length,width,Math.max(0,y-height(t)))
 }

function drawGrindSparks(){
   const block=s.rail?.block;
   const hazard=!!block?.red;
   const blockInk=block&&!hazard?trackBlockMaterial(block).top:null;
   const friendly=!diveMission||s.rail?.type==='harpoon';
   ctx.save();
   ctx.lineCap='round';
   const pixelScale=clamp(Math.min(W,H)/480,.75,2)*(1+.55*rideMusic.accent());
   for(let i=0;i<32;i++){
     const t=(s.time*(3.8+(i%5)*.35)+i*.618)%1;
     const side=i%2?1:-1;
     const x=s.x+side*(.12+t*(.7+(i%7)*.21));
     const m=s.z-.12-t*(1.1+(i%4)*.48);
     const h=s.y+.06+t*(1-t)*(1.8+(i%3)*.6);
     const [sx,sy]=point(x,h,m),[tx,ty]=point(x+side*.22,h+.12,m-.32);
     ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);
     const darkEmber=hazard&&(i%4===1||i%4===2);
     ctx.strokeStyle=hazard?'#ff202a':blockInk??(friendly?'#69cfff':'#ff474c');
     ctx.globalAlpha=(1-.65*t)*.35;ctx.lineWidth=6*pixelScale;ctx.stroke();
     if(darkEmber)ctx.strokeStyle='#10090b';
     ctx.globalAlpha=1-.45*t;ctx.lineWidth=2.5*pixelScale;ctx.stroke();
     ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo((sx+tx)/2,(sy+ty)/2);
     ctx.strokeStyle=hazard?(darkEmber?'#080506':'#ff5149'):blockInk??(friendly?'#dcfaff':'#ffddd1');ctx.lineWidth=1.2*pixelScale;ctx.stroke();
   }
   ctx.restore();
 }
