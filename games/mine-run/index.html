<!doctype html>
<html lang="ko">
<head>

<title>마인런 · v9</title>
<style>
:root{color-scheme:dark;--accent:#b2f7a1;--accent-rgb:178,247,161;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0c1517}
body{display:flex;align-items:center;justify-content:center;color:#edf5ed}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.app{position:relative;width:100%;max-width:500px;height:100%;height:100dvh;overflow:hidden;background:#15261f;isolation:isolate;box-shadow:0 0 90px #0003}
.world{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.distance{position:absolute;z-index:20;top:calc(13px + env(safe-area-inset-top));right:calc(13px + env(safe-area-inset-right));display:flex;align-items:baseline;gap:5px;min-height:42px;padding:9px 13px;border:1px solid #e4fff018;border-radius:13px;background:#091519ce;box-shadow:0 4px 20px #0002;font-size:24px;line-height:1;font-weight:750;letter-spacing:-.8px;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);user-select:none}
.distance:disabled{cursor:default;opacity:1}

.menu-button{position:absolute;z-index:20;top:calc(13px + env(safe-area-inset-top));left:calc(13px + env(safe-area-inset-left));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#091519ce;border:1px solid #e4fff035;box-shadow:0 4px 20px #0002;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

<body>
<main class="app" id="app" aria-label="마인런 게임">
  <section class="world" id="world" aria-label="드래그 또는 방향키로 이동하는 지뢰찾기 러닝 게임">
    <canvas id="game" aria-label="로봇의 발밑 기준점이 칸에 들어가면 열려. 숫자로 안전한 길을 판단하고 지뢰를 피해."></canvas>
  </section>
  <button class="menu-button" id="menuBtn" aria-label="메뉴 열기 및 일시정지" title="메뉴" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <button class="distance" id="hudDistance" aria-label="이동 거리. 누르면 일시정지하거나 계속 달려."><span id="distance">0</span><small>m</small></button>
  <button class="fast-forward" id="fastForwardBtn" aria-label="누르는 동안 2배 빨리감기. F 키로도 조작." aria-pressed="false" title="누르는 동안 2배 빨리감기 · F" hidden><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M3 4a1 1 0 0 1 1.5-.85l12 10a1.1 1.1 0 0 1 0 1.7l-12 10A1 1 0 0 1 3 24zM16 4a1 1 0 0 1 1.5-.85l12 10a1.1 1.1 0 0 1 0 1.7l-12 10A1 1 0 0 1 16 24z"/></svg></button>

  <section class="overlay" id="intro" role="dialog" aria-modal="true" aria-label="게임 시작">

  </section>

    <div class="panel"><div class="result" aria-label="이번 이동 거리"><span class="result-label">이동 거리</span><strong><span id="overDistance">0</span><small>m</small></strong></div><button class="primary" id="retryBtn">다시 시작</button><button class="secondary" id="overExitBtn">종료하기</button></div>
  </section>
</main>
<script>
'use strict';
(() => {
  /** v9: one square = one metre. Game time, not wall time, controls difficulty.
      Fast-forward multiplies game time and world motion, NOT steering speed. */
  const CONFIG = Object.freeze({
    columns: 8,
    metresPerTile: 1,
    baseSpeed: 1.25,
    speedStepSeconds: 30,
    speedIncrement: 0.05,
    stageSeconds: 75,
    rowsPerGroup: 5,
    fastForwardMultiplier: 2,  // Hold the round button (or F): world + game clock.
    generationAttempts: 32,
    generationBudgetMs: 18,    // Prefer an easier CERTIFIED map to a frame stall.
    playerSpeed: 7.8,          // Same capped movement speed as v3; input has no acceleration/easing.
    dragSensitivity: 1.10,
    activationZone: 1.0,       // The robot centre activates the entire tile area; no dead gap between blocks.
    playerMinY: 0.88,          // Keep the robot/antenna visible at the top.
    fixedStep: 1 / 120,
    maxFrameDelta: 0.10,
    settingsKey: 'mine-run.v2.settings'
  });
  const THEMES = [
    { name:'초원', time:0,   difficulty:1.5, rowMax:3, minesPerGroup:5.5, accent:'#b2f7a1', bg:'#15261f', tile:'#294732', edge:'#466445', closed:'#11271f', mark:'#59725f', glow:'#85b467', deco:'#779560' },
    { name:'사막', time:75, difficulty:2, rowMax:3, minesPerGroup:6, accent:'#ffd293', bg:'#32291e', tile:'#735d3c', edge:'#a1875b', closed:'#3a3023', mark:'#8b7554', glow:'#e5b96e', deco:'#c5a26b' },
    { name:'설원', time:150, difficulty:2.5, rowMax:4, minesPerGroup:6.5, accent:'#b7e7ff', bg:'#162735', tile:'#395e73', edge:'#648599', closed:'#1b3343', mark:'#5f8398', glow:'#91d8f3', deco:'#aedced' },
    { name:'화산', time:225, difficulty:3, rowMax:4, minesPerGroup:7, accent:'#ffb18a', bg:'#24191c', tile:'#493438', edge:'#7c4a41', closed:'#291c22', mark:'#89554a', glow:'#ff7447', deco:'#c37652' },
    { name:'사이버',time:300,difficulty:3.5,rowMax:4, minesPerGroup:7.5, accent:'#8bf7e7', bg:'#0b1b25', tile:'#173846', edge:'#2f5f6b', closed:'#0b202e', mark:'#387d86', glow:'#42e6d3', deco:'#459d9e' },
    { name:'우주', time:375, difficulty:4, rowMax:4, minesPerGroup:8, accent:'#d5bcff', bg:'#101125', tile:'#2e2a49', edge:'#524b79', closed:'#19192e', mark:'#6a618d', glow:'#a68df2', deco:'#a294cc' }
  ];
// BEGIN LOGIC ENGINE
/* MineRun v9 — original, deterministic, visible-information-only logic engine.
 * No probabilities, truth-oracle inference, or hidden group totals are used.
 * Real mines are consulted only to emulate opening a PROVEN-safe cell and to
 * check a certificate for implementation errors. A final guard row is inferred
 * but never opened until the next batch supplies its real upper neighbour.
 */
const MineLogic = (() => {
  'use strict';
  const COLS=8;
  const PROFILES=Object.freeze([
    {level:1,min:1,max:1,depth:1,pairs:false,overlap:false,label:'직접 추론'},
    {level:2,min:1,max:2,depth:2,pairs:false,overlap:false,label:'짧은 연쇄'},
    {level:3,min:2,max:3,depth:3,pairs:false,overlap:false,label:'지뢰 확정 후 안전칸'},
    {level:4,min:3,max:4,depth:3,pairs:true,overlap:false,label:'부분집합 비교'},
    {level:5,min:4,max:5,depth:4,pairs:true,overlap:true,label:'겹친 영역과 연쇄'},
    {level:6,min:4,max:6,depth:5,pairs:true,overlap:true,label:'복수 영역·긴 연쇄'}
  ].map(Object.freeze));
  const key=(r,c)=>r*COLS+c;
  const rowOf=id=>Math.floor(id/COLS);
  const colOf=id=>id%COLS;
  function neighbours(id){const r=rowOf(id),c=colOf(id),out=[];for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(y>=0&&x>=0&&x<COLS&&(x!==c||y!==r))out.push(key(y,x));return out;}
  function count(rows,id){let n=0;for(const v of neighbours(id))n+=rows.get(rowOf(v))?.mines[colOf(v)]||0;return n;}
  const union=(a,b)=>new Set([...a,...b]);
  function rank(depth,kind){return kind===2?(depth>4?6:5):kind===1?(depth>3?6:4):Math.min(6,Math.max(1,depth));}
  /** Each equation is sum(cell mine indicators) = n. All deductions have a
   *  proof depth and a rule grade. Returned values are 0 (safe) or 1 (mine).
   *  Input equations must come from revealed clues; this function knows no map.
   */
  function deduce(equations,level=6){
    const profile=PROFILES[Math.max(0,Math.min(5,level-1))],facts=new Map();
    const eqs=[],signatures=new Map();let contradiction=false,rounds=0,pairOps=0;
    const add=(cells,n,depth=0,kind=0,sources=new Set())=>{
      cells=[...new Set(cells)].sort((a,b)=>a-b);
      if(n<0||n>cells.length){contradiction=true;return false;}
      if(!cells.length){if(n)contradiction=true;return false;}
      const sig=cells.join(',');
      if(signatures.has(sig)){const q=eqs[signatures.get(sig)];if(q.n!==n)contradiction=true;return false;}
      if(eqs.length>=240)return false;
      signatures.set(sig,eqs.length);eqs.push({cells,n,depth,kind,sources});return true;
    };
    for(let i=0;i<equations.length;i++){const e=equations[i];add(e.cells,e.n,0,0,new Set(e.sources||[i]));}
    while(!contradiction&&rounds++<profile.depth+5){
      let changed=false;
      // Normalize equations using only already justified facts.
      for(const e of eqs){
        const rest=[];let n=e.n,depth=e.depth,kind=e.kind,sources=e.sources;
        for(const id of e.cells){const f=facts.get(id);if(f){n-=f.value;depth=Math.max(depth,f.depth);kind=Math.max(kind,f.kind);sources=union(sources,f.sources);}else rest.push(id);}
        if(n<0||n>rest.length){contradiction=true;break;}
        e.cells=rest;e.n=n;e.depth=depth;e.kind=kind;e.sources=sources;
      }
      if(contradiction)break;
      // Parallel inference passes make proof-chain lengths independent of scan order.
      const pending=[];
      for(const e of eqs){
        if(!e.cells.length||(e.n!==0&&e.n!==e.cells.length))continue;
        const d=e.depth+1,grade=rank(d,e.kind);
        if(d>profile.depth||grade>level)continue;
        for(const id of e.cells)pending.push({id,value:e.n===0?0:1,depth:d,kind:e.kind,grade,sources:e.sources});
      }
      for(const f of pending){const old=facts.get(f.id);if(old&&old.value!==f.value){contradiction=true;break;}if(!old){facts.set(f.id,f);changed=true;}}
      if(contradiction)break;
      if(changed)continue;
      if(!profile.pairs)break;
      // Rebuild signatures after normalization; then compare overlapping regions.
      signatures.clear();eqs.forEach((e,i)=>{if(e.cells.length)signatures.set(e.cells.join(','),i);});
      const active=eqs.filter(e=>e.cells.length>1&&e.depth<profile.depth);
      const before=eqs.length;
      for(let i=0;i<active.length&&pairOps<16000;i++)for(let j=i+1;j<active.length&&pairOps++<16000;j++){
        const a=active[i],b=active[j],bs=new Set(b.cells),as=new Set(a.cells);
        const inter=a.cells.filter(x=>bs.has(x));if(!inter.length)continue;
        const ao=a.cells.filter(x=>!bs.has(x)),bo=b.cells.filter(x=>!as.has(x));
        const d=Math.max(a.depth,b.depth)+1,sources=union(a.sources,b.sources);
        if(d>=profile.depth)continue;
        if(!ao.length&&bo.length)add(bo,b.n-a.n,d,Math.max(1,a.kind,b.kind),sources);
        else if(!bo.length&&ao.length)add(ao,a.n-b.n,d,Math.max(1,a.kind,b.kind),sources);
        else if(profile.overlap&&ao.length&&bo.length){
          // Exact bounds on the shared mine count. No assignment is guessed.
          const low=Math.max(0,a.n-ao.length,b.n-bo.length);
          const high=Math.min(inter.length,a.n,b.n);
          if(low>high){contradiction=true;break;}
          if(low===high){const kind=Math.max(2,a.kind,b.kind);add(inter,low,d,kind,sources);add(ao,a.n-low,d,kind,sources);add(bo,b.n-low,d,kind,sources);}
        }
      }
      if(eqs.length===before)break;
    }
    return {facts,contradiction,rounds,equations:eqs.length,pairOps};
  }
  function clues(rows,opened,bounds,guard){
    const equations=[];
    for(const id of opened){const r=rowOf(id);if(r<bounds.min||r>bounds.max||r>=guard||!rows.has(r))continue;
      const cells=neighbours(id).filter(v=>!opened.has(v));
      if(cells.length)equations.push({cells,n:count(rows,id),sources:[id]});
    }
    return equations;
  }
  function flood(rows,opened,start,bounds,guard){
    if(opened.has(start)||rowOf(start)>=guard||rowOf(start)<bounds.min||rowOf(start)>bounds.max)return 0;
    if(!rows.has(rowOf(start))||rows.get(rowOf(start)).mines[colOf(start)])throw new Error('Unsafe certificate opening');
    const queue=[start],seen=new Set();let n=0;
    for(let h=0;h<queue.length;h++){
      const id=queue[h],r=rowOf(id),row=rows.get(r);if(seen.has(id)||r<bounds.min||r>bounds.max||r>=guard||!row)continue;seen.add(id);
      if(row.mines[colOf(id)])continue;
      if(!opened.has(id)){opened.add(id);n++;}
      if(id===start||count(rows,id)===0)queue.push(...neighbours(id));
    }
    return n;
  }
  function walkable(rows,opened,facts,cursor,bounds){
    const q=[cursor],prev=new Map([[cursor,null]]);
    for(let h=0;h<q.length;h++){
      const id=q[h],r=rowOf(id),c=colOf(id);
      const ns=[];if(r<bounds.max)ns.push(id+COLS);if(c>0)ns.push(id-1);if(c<COLS-1)ns.push(id+1);if(r>bounds.min)ns.push(id-COLS);
      for(const v of ns){if(prev.has(v)||!rows.has(rowOf(v)))continue;if(!opened.has(v)&&facts.get(v)?.value!==0)continue;prev.set(v,id);q.push(v);}
    }
    return {cells:q,prev};
  }
  /** Certify a connected continuation from the preceding batch's actual proof
   *  state. Guard-row safe entry is the handoff to the next batch. Existing
   *  open cells do NOT trigger floods. Clues outside the moving viewport are
   *  ignored, including clues which have already left its bottom.
   */
  function verify(rows,seedState,{level=6,viewRows=16,guard,maxActions=220}={}){
    if(guard==null)guard=Math.max(...rows.keys());
    const opened=new Set((seedState.opened||[]).filter(id=>rows.has(rowOf(id))));
    let cursor=seedState.cursor,camera=Math.min(seedState.camera||viewRows,guard+1),peak=1,actions=0;
    const proofs=[],route=[cursor];
    const bounds=()=>({min:Math.max(0,Math.floor(camera-viewRows+1e-9)),max:Math.min(guard,Math.floor(camera+1e-9)-1)});
    let b=bounds();
    if(!rows.has(rowOf(cursor))||rows.get(rowOf(cursor)).mines[colOf(cursor)])return {ok:false,reason:'unsafe-entry'};
    if(rowOf(cursor)<b.min||rowOf(cursor)>b.max)return {ok:false,reason:'entry-outside-view'};
    flood(rows,opened,cursor,b,guard);
    while(actions++<maxActions){
      b=bounds();
      for(const id of [...opened])if(rowOf(id)<b.min-1)opened.delete(id);
      const equations=clues(rows,opened,b,guard);
      let chosen=null,reach=null,used=1,proof=null;
      for(let tier=1;tier<=level;tier++){
        const result=deduce(equations,tier);if(result.contradiction)return {ok:false,reason:'contradictory-clues'};
        reach=walkable(rows,opened,result.facts,cursor,b);
        const candidates=reach.cells.filter(id=>!opened.has(id)&&rowOf(id)<=guard);
        if(candidates.length){
          candidates.sort((a,z)=>rowOf(z)-rowOf(a)||Math.abs(colOf(a)-colOf(cursor))-Math.abs(colOf(z)-colOf(cursor)));
          chosen=candidates[0];used=tier;proof=result.facts;break;
        }
      }
      if(chosen!==null){
        const path=[];let v=chosen;while(v!==cursor&&v!=null){path.push(v);v=reach.prev.get(v);}path.reverse();
        for(const id of path){
          const wasOpen=opened.has(id),f=proof.get(id);
          if(!wasOpen&&f?.value!==0)return {ok:false,reason:'unproven-step'};
          if(rows.get(rowOf(id))?.mines[colOf(id)])throw new Error('Invalid safe deduction');
          cursor=id;route.push(id);
          if(!wasOpen){peak=Math.max(peak,used);proofs.push({id,grade:used,depth:f.depth,kind:f.kind,sources:[...f.sources]});}
          if(rowOf(id)===guard){
            return {ok:true,score:peak,actions,proofs,route,state:{cursor,opened:[...opened],camera},guard};
          }
          if(!wasOpen)flood(rows,opened,id,b,guard);
        }
        continue;
      }
      // A row entering the viewport can be inferred from an existing zero.
      // Waiting does not reveal it and does not supply an off-screen clue.
      const frontier=reach.cells.reduce((a,id)=>rowOf(id)>rowOf(a)?id:a,cursor);
      if(camera<guard+1-1e-9&&rowOf(frontier)>=b.max-1){
        const path=[];let v=frontier;while(v!==cursor&&v!=null){path.push(v);v=reach.prev.get(v);}path.reverse();
        cursor=frontier;route.push(...path);camera=Math.min(guard+1,camera+1);continue;
      }
      return {ok:false,reason:'no-logical-route',score:peak,actions,frontier:rowOf(frontier),guard};
    }
    return {ok:false,reason:'action-budget'};
  }
  return Object.freeze({COLS,PROFILES,key,rowOf,colOf,neighbours,count,deduce,clues,flood,walkable,verify});
})();
// END LOGIC ENGINE
// BEGIN MAP GENERATOR
/* Bounded rejection sampler. Every committed chunk has a linked certificate;
 * rejected maps never enter play. A simpler verified map wins over a guess.
 * No mine belonging to an already committed group is moved or deleted.
 */
const MineGenerator = (() => {
  'use strict';
  const L=typeof MineLogic!=='undefined'?MineLogic:require('./logic.js');
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  // Half tiers alternate adjacent whole-tier batches, keeping every quota integral.
  const DIFFICULTIES=Object.freeze([1.5,2,2.5,3,3.5,4]);
  const MAX_BLANK_STREAK=6;
  function targetFor(stage,group){
    const difficulty=DIFFICULTIES[clamp(stage,0,5)];
    const level=Math.floor(difficulty)+(difficulty%1&&group%2?1:0);

    config:CONFIG,themes:THEMES,difficulty,stageAt,baseDistanceBetween,
    adjacent,collide,centeredCell,centerEntry,processFootMotion,makeRun,generateTo,
    ensureWorld,arrivedBounds,revealFrom,revealSteppedCell,effectiveSpeed,timeScale,
    logic:MineLogic,generator:MineGenerator,
    setFastForward:on=>{fastInput.key=!!on;updateFastForward();},
    state:()=>({mode,time:run.time,scroll:run.scroll,distance:run.scroll*CONFIG.metresPerTile,
      speed:effectiveSpeed(run),baseSpeed:difficulty(run.time).speed,boost:run.fastForward,timeScale:timeScale(run),generation:run.generationStats,
      stage:stageAt(run.time),theme:themeIndex,practice:run.practice,seed:run.seed,
      player:{...run.player},rowCount:run.rows.size,viewRows,cameraOrigin:run.cameraOrigin,
      deadCell:run.deathCell,width:W,height:H,tileSize:S,
      revealed:[...run.rows.values()].reduce((sum,r)=>sum+r.revealed.reduce((a,b)=>a+b,0),0)}),
    start:(index=0,practice=false)=>startRun(index,practice),
    advance:(seconds,invincible=false)=>{
      run.invincible=invincible;
      for(let i=0;i<Math.round(seconds/CONFIG.fixedStep)&&mode==='playing';i++)step(CONFIG.fixedStep);
      run.invincible=false;updateHUD();draw(0);return mode;
    },
    setTime:t=>{run.offset=t;run.time=t;run.ticks=0;run.steps=0;
      lastStage=stageAt(t);applyTheme(stageAt(t),true);updateHUD();draw(0);},
    setPlayer:(x,y)=>{run.player.x=x;run.player.y=y;run.player.tx=x;run.player.ty=y;playerBounds(run);},
    moveTo:(x,y)=>{const result=movePlayer(run,x,y);draw(0);return result;},
    clearBoard:()=>{for(const row of run.rows.values()){row.mines.fill(0);row.revealed.fill(0);}},
    setMine:(r,c,on=true)=>{run.rows.get(r).mines[c]=on?1:0;},
    run:()=>run,
    forceHit:()=>{
      const r=Math.floor(run.scroll+run.cameraOrigin-run.player.y),c=Math.floor(run.player.x);
      run.rows.get(r).mines[c]=1;run.player.x=c+.5;run.player.tx=c+.5;
      run.player.y=run.scroll+run.cameraOrigin-r-.5;run.player.ty=run.player.y;step(CONFIG.fixedStep);
    },
    pause:pauseGame,resume:resumeGame,home:goHome,
    snapshot:()=>[...run.rows.values()].map(r=>({index:r.index,group:r.group,stage:r.stage,
      groupMineCount:r.groupMineCount,rowMax:r.rowMax,path:r.path,logicScore:r.logicScore,logicFallback:r.logicFallback,mines:[...r.mines],revealed:[...r.revealed]})),
    render:()=>draw(0)
  };
  resize();try{goHome();}catch(e){generationFailure(e);}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
